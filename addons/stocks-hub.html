.chart .ref-label { font-family: var(--mono); font-size: 10.5px; }
.chart .dot { fill: var(--soon); stroke: var(--col); stroke-width: 1.5; }
.chart .cross { stroke: var(--muted); stroke-width: 1; }
.chart .hover-dot { fill: var(--accent); stroke: var(--col); stroke-width: 2; }
.chart-empty { padding: 22px 10px; text-align: center; color: var(--muted); font-size: calc(12.5px * var(--fs)); }
.chart-tip {
  position: fixed; z-index: 60; pointer-events: none;
  padding: 5px 9px; border-radius: 6px; background: var(--fg); color: var(--bg);
  font-size: calc(12px * var(--fs)); font-family: var(--mono); white-space: nowrap;
}
.chart-tip[hidden] { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: calc(12px * var(--fs)); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Donuts */
.donut-wrap { display: flex; align-items: center; gap: 14px; }
.donut-wrap svg { flex: none; width: 120px; height: 120px; }
.donut-list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: calc(12.5px * var(--fs)); }
.donut-list .row { display: flex; align-items: center; gap: 6px; }
.donut-list .row i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.donut-list .row .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-list .row .pct { font-family: var(--mono); color: var(--muted); }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; flex-shrink: 0; }
.kpi { background: var(--col); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .k { font-size: calc(12px * var(--fs)); color: var(--muted); }
.kpi .v { font-family: var(--mono); font-weight: 700; font-size: calc(18px * var(--fs)); }
.kpi .d { font-family: var(--mono); font-size: calc(12px * var(--fs)); }

/* Lists in cards */
.mini-table { width: 100%; border-collapse: collapse; font-size: calc(12.5px * var(--fs)); }
.mini-table td, .mini-table th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.mini-table th { color: var(--muted); font-weight: 600; font-size: calc(11.5px * var(--fs)); }
.mini-table td.num, .mini-table th.num { text-align: right; font-family: var(--mono); }
.mini-table tr.click { cursor: pointer; }
.mini-table tr.click:hover td { background: var(--accent-soft); }
.scroll-box { max-height: 260px; overflow-y: auto; }

/* Planner */
.range-bar { position: relative; height: 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); margin: 16px 0 18px; }
.range-bar .seg { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.range-bar .mark { position: absolute; top: -5px; width: 2px; height: 18px; border-radius: 1px; }
.range-bar .mark span { position: absolute; top: -17px; transform: translateX(-50%); font-family: var(--mono); font-size: calc(10.5px * var(--fs)); white-space: nowrap; }
.range-bar .mark.below span { top: 19px; }
.plan-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan-inputs label { font-size: calc(11.5px * var(--fs)); color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.plan-inputs input { font-family: var(--mono); font-size: calc(13px * var(--fs)); padding: 4px 7px; width: 100%; }
.plan-out { font-size: calc(12.5px * var(--fs)); line-height: 1.5; }
.plan-out b { font-family: var(--mono); }

/* News */
.news-list { display: flex; flex-direction: column; gap: 6px; }
.news-item { display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-decoration: none; color: inherit; }
.news-item:hover { border-color: var(--accent); }
.news-item .h { font-size: calc(12.5px * var(--fs)); line-height: 1.35; }
.news-item .m { font-size: calc(11px * var(--fs)); color: var(--muted); }
.earn-line { font-size: calc(13px * var(--fs)); }
.earn-line b { font-family: var(--mono); }

/* Settings tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 6px; flex-wrap: wrap; }
.tab-panel[hidden] { display: none; }
.check-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: calc(13px * var(--fs)); }
.hint { font-size: calc(11.5px * var(--fs)); color: var(--muted); line-height: 1.4; }
.api-meter { display: flex; gap: 14px; font-size: calc(12.5px * var(--fs)); padding: 6px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.api-meter b { font-family: var(--mono); }
.modal-box.wide { max-width: 720px; }
.field label { font-size: calc(12px * var(--fs)); }
.field input, .field select, .field textarea { font-size: calc(13px * var(--fs)); width: 100%; }
.field { display: flex; flex-direction: column; gap: 4px; }
.error { color: var(--late); }
.preview-list { font-size: calc(12px * var(--fs)); line-height: 1.5; max-height: 160px; overflow-y: auto; padding: 6px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); }
.preview-list .row { display: flex; justify-content: space-between; gap: 10px; }
.preview-list .row b { font-family: var(--mono); font-weight: 600; }

/* Tome's page styles give every svg an outline (they're meant for icons); charts set their own. */
.chart svg, .donut-wrap svg { stroke: none; }
.chart svg text, .donut-wrap svg text { stroke: none; }
.donut-wrap svg path { stroke: var(--col); stroke-width: 1; }
.pos-day { white-space: nowrap; flex: none; }
.stat-strip { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); }
.stat-num { overflow-wrap: anywhere; }
/* Top strip: accounts and buttons on the first row, totals on the second. */
.summary-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "acct act" "met met"; row-gap: 6px; align-items: center; }
.summary-bar .acct-tabs { grid-area: acct; }
.summary-bar .metrics-group { grid-area: met; }
.summary-bar .bar-actions { grid-area: act; align-self: start; }
.core-sat { min-width: 180px; }

.pane-right { overflow-x: hidden; }

/* What's new */
.wn { max-height: 60vh; overflow: auto; }
.wn-head { margin: 10px 0 4px; font-size: 1.05em; }
.wn-head:first-child { margin-top: 0; }
.wn-head .muted { font-weight: 400; font-size: .85em; margin-left: 6px; }
.wn-list { margin: 0 0 8px; padding-left: 20px; line-height: 1.5; }
.modal-foot .wn-btn { margin-right: auto; }

/* Settings, For AI (0.5) */
.ai-rows { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
.ai-row { display: grid; grid-template-columns: calc(230px * var(--fs, 1)) 1fr; gap: 12px; align-items: center; }
.ai-row button { justify-self: stretch; }

</style>
</head>

<script>
(function () {
const ADDON = {"version":"0.6","changes":[{"version":"0.6","date":"2026-11-26","lines":["Settings, For AI: the main button is now called Make changes to this add-on, the same name every add-on uses."]},{"version":"0.5","date":"2026-11-25","lines":["Copying the code needs Tome 1.43.0 or newer; the description works everywhere.","Settings, For AI: copy everything a new AI chat needs to work on Stocks Hub (how add-ons work, what Stocks Hub is, and its code), or just the description, or just the code. None of your positions, notes or keys are included.","In Tome, right-click Stocks Hub's name in the top bar for the same."]},{"version":"0.4","date":"2026-11-25","lines":["No calls at all (prices, charts or news) while Tome previews or tests a new version before installing it, so updates never use up your daily calls."]}],"spec":"# Stocks Hub\n\nAdd-on id `stocks-hub`. Kept in a private repo (tomer629/Tome-Addons) with its source split into files under `stocks-hub/src/` and built into the single installed file. Working in a chat without the repo: describe changes, or return the whole updated file with a higher version (0.x) and the same id; Thomas has it merged into the source.\n\nA personal dashboard for stocks, ETFs and net worth, fed by a positions CSV exported from the brokerage. Built to match the brokerage's All accounts total to the cent, while keeping internet calls few (it also runs on a work PC).\n\nDecisions and ideas: `BACKLOG.md`. Versions: `CHANGES.md`. Needs Tome 1.39+ to sync between PCs, 1.40+ to update by itself.\n\n## Views (pills in Tome's bar, with an in-page fallback)\n\n| View | What it shows |\n|---|---|\n| Positions | Individual stocks: cards on the left (value, gain or loss, right-click for more), detail on the right: price chart, across-accounts card, thesis checklist, exit strategy, decision log, trim and target planner, earnings and news, research links |\n| ETFs | ETFs and funds, overlap between them and look-through holdings |\n| Overview | Value over time, allocation donuts, today's movers, tax-loss candidates, total net worth with manual assets |\n| Watchlist | Stocks being watched |\n| Closed | Closed positions and lessons |\n| Options | Open options from the last import |\n\nSettings window, five tabs: Prices and calls (keys, refresh, call limit), Display, Limits and reminders, Backup and links, For AI (Make changes to this add-on, Copy description, Copy code). Also What's new.\n\n## Getting data in\n\n- Drop or choose the CSV anywhere on the page. Re-imports update shares, cost and price and keep notes; positions missing from the import are offered to move to Closed.\n- Prices: the CSV's own prices, then optional refreshes from free quote services with the person's own keys (or a custom quote address), within a daily call limit. Auto refresh every few hours, market hours only by default.\n- A reminder bar when there's been no import for a week (adjustable).\n\n## Saved data (tome.data)\n\nOne object, `version: 1`:\n\n```\npositions[]      { id, ticker, name, account, shares, avgCost, currentPrice, sector, tags[], isEtf, expenseRatio,\n                   thesis[{ id, text, checked }], exitStrategy, decisionLog[{ id, date, note }], lastReviewed,\n                   manualStatus, netOptionPremium, ... }\nwatchlist[], closed[]\nmanualAssets[]   { id, name, category, value, owed, updatedAt, notes }\nsnapshots[]      { date, total, invested, cash, options, manual, byAccount, prices }   value over time, one per day\ncashByAccount, openOptionsByAccount, openOptions[], accountKinds, lastImport, etfCache, lastQuoteRefresh\napi              { day, finnhub, av }   call counter (per PC)\ncache            { chart, news, earn }  saved charts and news (per PC)\nremindSnooze\nsettings         keys, refresh and limits, weightBase, fontSize, netWorthInBar, researchLinks[]\n```\n\nSync (Tome's js/sync-stocks.js) merges each position, watchlist item, closed trade and manual asset field by field; the call counter, auto refresh settings, saved charts and news, and the reminder snooze stay on each PC. A new field in a list record syncs by itself; a new top-level field needs a Tome change.\n\n## Kit calls used\n\ntome.data, tome.bar, tome.menu, tome.toast, tome.open, tome.copy, tome.download, tome.preview (no calls in a preview), tome.about (this file, sent by the build), tome.code and tome.aiPack (For AI, Tome 1.43+).\n\n## Source\n\n`src/js/` in load order: 00-core (state, helpers, numbers), 10-api (quotes and call budget), 20-import (CSV), 30-charts, 35-shell (views and bar), 40-positions, 41-etfs, 42-overview, 43-lists (watchlist, closed, options), 50-modals, 55-whatsnew, 60-settings, 90-init.\n"};
if (typeof tome !== 'undefined' && tome && typeof tome.about === 'function' && ADDON.spec) tome.about(ADDON.spec);
/* ---- 00-core.js ---- */
/* Core: state, helpers, and the numbers every view uses. */
'use strict';

const DEFAULT_RESEARCH_LINKS = [
  { label: 'Yahoo Finance', url: 'https://finance.yahoo.com/quote/{TICKER}' },
  { label: 'TradingView Chart', url: 'https://www.tradingview.com/chart/?symbol={TICKER}' },
  { label: 'Finviz', url: 'https://finviz.com/quote.ashx?t={TICKER}' },
  { label: 'SEC EDGAR Filings', url: 'https://www.sec.gov/edgar/browse/?CIK={TICKER}' },
  { label: 'ETF Holdings (StockAnalysis)', url: 'https://stockanalysis.com/etf/{TICKER}/holdings/', etfOnly: true }
];

const KNOWN_ETFS = new Set([
  'VOO','VTI','SPY','IVV','QQQ','QQQM','SCHD','VGT','VXUS','VEA','VWO','BND','AGG',
  'IWM','DIA','VIG','VYM','JEPI','JEPQ','XLK','XLF','XLV','XLE','XLI','XLY','XLP',
  'ARKK','SMH','SOXX','GLD','SLV','TLT','SGOV','BIL','VT','VO','VB','VUG','VTV','AVUV'
]);

const ACCOUNT_KINDS = [
  { id: 'taxable', label: 'Taxable brokerage' },
  { id: 'roth', label: 'Roth IRA' },
  { id: 'ira', label: 'Traditional IRA' },
  { id: 'hsa', label: 'Health savings (HSA)' },
  { id: 'k401', label: '401(k) or work plan' },
  { id: 'cash', label: 'Cash account' }
];
const ASSET_CATEGORIES = ['External 401(k)', 'Real Estate / Home', 'Cash / Bank', 'Vehicle', 'Other'];

function defaultState() {
  return {
    version: 1,
    positions: [],
    watchlist: [],
    closed: [],
    etfCache: {},
    lastQuoteRefresh: 0,
    // 0.1
    cashByAccount: {},          // account name: core cash + pending activity
    openOptionsByAccount: {},   // account name: net current value of open option rows
    openOptions: [],            // option rows from the last import (shown in the Options tab)
    accountKinds: {},           // account name: taxable | roth | ira | hsa | k401 | cash
    manualAssets: [],           // { id, name, category, value, owed, updatedAt, notes }
    snapshots: [],              // { date, total, invested, cash, options, manual, byAccount, prices }
    lastImport: 0,
    api: { day: '', finnhub: 0, av: 0 },
    cache: { chart: {}, news: {}, earn: {} },
    remindSnooze: '',
    settings: {
      finnhubKey: '',
      alphaVantageKey: '',
      customQuoteUrl: '',
      refreshHours: 4,
      marketHoursOnly: true,
      dailyCallLimit: 150,
      autoChart: true,
      autoNews: true,
      maxStockPct: 10,
      maxSectorPct: 30,
      staleDays: 90,
      importRemindDays: 7,
      weightBase: 'invested',   // invested | total
      fontSize: 'm',            // s | m | l
      netWorthInBar: true,
      researchLinks: DEFAULT_RESEARCH_LINKS.slice()
    }
  };
}

let state = defaultState();
const ui = {
  view: 'positions',       // positions | etfs | overview | watchlist | closed | options
  account: 'ALL',
  statusFilter: 'all',
  search: '',
  selectedId: null,
  whatIfExcluded: new Set(),
  refreshing: false,
  refreshDone: 0,
  refreshTotal: 0,
  editingPriceId: null,
  chartRange: 'all',
  historySeries: 'total',
  historyRange: 'all'
};

const hasTome = typeof window.tome !== 'undefined' && !!window.tome;
const hasBar = hasTome && window.tome.bar && typeof window.tome.bar.set === 'function';

function toast(msg, opts) { if (hasTome && tome.toast) tome.toast(msg, opts); }
function openUrl(url) { if (hasTome && tome.open) tome.open(url); else window.open(url, '_blank', 'noopener'); }
function downloadFile(name, text, mime) { if (hasTome && tome.download) tome.download(name, text, mime); }
function showMenu(ev, items) { if (hasTome && tome.menu) tome.menu(ev, items); }

let saveTimer = null;
async function saveState() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (hasTome && tome.data && !tome.preview) {
    try { await tome.data.set(state); } catch (e) { console.error(e); toast('Not saved: ' + e.message); }
  }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }

function uid() { return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayStr() { return ymd(new Date()); }
function addDays(dateStr, n) { const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysSince(dateStr) {
  if (!dateStr) return 999;
  const t = typeof dateStr === 'number' ? dateStr : Date.parse(dateStr);
  if (isNaN(t) || !t) return 999;
  return Math.floor((Date.now() - t) / 86400000);
}
function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function fmtMoney(n) {
  const val = num(n);
  return (val < 0 ? '-' : '') + '$' + Math.abs(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtMoneyShort(n) {
  const val = num(n);
  return (val < 0 ? '-' : '') + '$' + Math.abs(val).toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function fmtSigned(n, short) { const v = num(n); return (v > 0 ? '+' : '') + (short ? fmtMoneyShort(v) : fmtMoney(v)); }
function fmtPct(n, showSign) { const val = num(n); return (showSign && val > 0 ? '+' : '') + val.toFixed(1) + '%'; }
function cls(n) { return num(n) >= 0 ? 'pos' : 'neg'; }
function fmtShares(n) { return num(n).toLocaleString('en-US', { maximumFractionDigits: 4 }); }

/* A CUSIP (employer plan funds like 66586Y488) can't be quoted. */
function isCusip(sym) { return /^[0-9][0-9A-Z]{8}$/.test(String(sym || '')); }
function canQuote(p) { return !!p.ticker && !isCusip(p.ticker) && !p.valueOnly; }

// ---------- Position math ----------
function posPrice(p) { return num(p.currentPrice) || num(p.avgCost); }
function posValue(p) {
  if (p.valueOnly) return num(p.valueOnly);
  // Fidelity's own rounded value while the price is still the imported one, so totals match to the cent.
  if (p.fidValue != null && num(p.fidPrice) === posPrice(p)) return num(p.fidValue);
  return num(p.shares) * posPrice(p);
}
function posCost(p) {
  if (p.valueOnly && p.costTotal != null) return num(p.costTotal);
  return num(p.shares) * num(p.avgCost);
}
function posPnl(p) { return posValue(p) - posCost(p); }
function posPnlPct(p) { const c = posCost(p); return c > 0 ? (posPnl(p) / c) * 100 : 0; }
function posDay(p) { return p.valueOnly ? 0 : num(p.shares) * num(p.dayChange); }

function getThesisStatus(p) {
  if (p.manualStatus) return p.manualStatus;
  const items = Array.isArray(p.thesis) ? p.thesis : [];
  if (!items.length) return 'hold';
  const broken = items.filter(t => !t.checked).length;
  return broken === 0 ? 'hold' : broken === 1 ? 'watch' : 'exit';
}
function isStale(p) { return !p.isEtf && daysSince(p.lastReviewed) >= (num(state.settings.staleDays) || 90); }

/* What kind of holding this is, for the allocation donut. */
function assetType(p) {
  const d = (p.name || '').toUpperCase();
  if (isCusip(p.ticker) || accountKind(p.account) === 'k401') return '401(k) funds';
  if (/BITCOIN|ETHER|CRYPTO/.test(d)) return 'Crypto';
  if (/\bGOLD\b|\bSILVER\b|PLATINUM|PRECIOUS/.test(d)) return 'Metals';
  if (/TREAS|0-3 MNTH|T-BILL|MONEY MARKET|\bCLO\b|BOND/.test(d) || ['SGOV','BIL','CLOI','BND','AGG','TLT'].includes(p.ticker)) return 'Bonds and T-bills';
  return p.isEtf ? 'ETFs and funds' : 'Stocks';
}

// ---------- Accounts ----------
function guessKind(name) {
  const n = String(name || '').toLowerCase();
  if (/roth/.test(n)) return 'roth';
  if (/\bira\b|rollover|traditional/.test(n)) return 'ira';
  if (/health savings|\bhsa\b/.test(n)) return 'hsa';
  if (/401|403|457|plan\b|retirement/.test(n)) return 'k401';
  if (/cash acct|debit|checking/.test(n)) return 'cash';
  return 'taxable';
}
function accountKind(name) { return (state.accountKinds && state.accountKinds[name]) || guessKind(name); }
function kindLabel(id) { const k = ACCOUNT_KINDS.find(x => x.id === id); return k ? k.label : id; }
function isTaxable(name) { return accountKind(name) === 'taxable'; }

function getAccounts() {
  const set = new Set();
  state.positions.forEach(p => { if (p.account) set.add(p.account); });
  Object.keys(state.cashByAccount || {}).forEach(a => { if (Math.abs(num(state.cashByAccount[a])) >= 1) set.add(a); });
  Object.keys(state.openOptionsByAccount || {}).forEach(a => { if (num(state.openOptionsByAccount[a])) set.add(a); });
  return Array.from(set).sort((a, b) => accountTotal(b) - accountTotal(a));
}
function inAccount(name) { return ui.account === 'ALL' || name === ui.account; }
function accountTotal(name) {
  let v = 0;
  state.positions.forEach(p => { if (p.account === name) v += posValue(p); });
  return v + num((state.cashByAccount || {})[name]) + num((state.openOptionsByAccount || {})[name]);
}
function accountPnl(name) {
  let v = 0;
  state.positions.forEach(p => { if (p.account === name) v += posPnl(p); });
  return v;
}

function getFilteredPositions(opts) {
  const onlyStocks = opts && opts.onlyStocks;
  const onlyEtfs = opts && opts.onlyEtfs;
  return state.positions.filter(p => {
    if (!inAccount(p.account)) return false;
    if (onlyStocks && p.isEtf) return false;
    if (onlyEtfs && !p.isEtf) return false;
    return true;
  });
}
function sumMap(map) {
  let v = 0;
  Object.keys(map || {}).forEach(a => { if (inAccount(a)) v += num(map[a]); });
  return v;
}
function manualNet() {
  return (state.manualAssets || []).reduce((s, a) => s + num(a.value) - num(a.owed), 0);
}

/* Every total in the filtered view. invested = holdings only; total = holdings + cash + open options (matches Fidelity). */
function getPortfolioTotals(excludeWhatIf) {
  const list = getFilteredPositions();
  let invested = 0, cost = 0, etfVal = 0, stkVal = 0, day = 0, dayKnown = 0;
  list.forEach(p => {
    if (excludeWhatIf && p.isEtf && ui.whatIfExcluded.has(p.id)) return;
    const v = posValue(p);
    invested += v;
    cost += posCost(p);
    if (p.isEtf) etfVal += v; else stkVal += v;
    if (p.dayChange != null && !p.valueOnly) { day += posDay(p); dayKnown++; }
  });
  const cash = sumMap(state.cashByAccount);
  const options = sumMap(state.openOptionsByAccount);
  const total = invested + cash + options;
  const pnl = invested - cost;
  const prevVal = invested - day;
  return {
    invested, totalVal: invested, cost, totalCost: cost, pnl,
    pnlPct: cost > 0 ? (pnl / cost) * 100 : 0,
    etfVal, stkVal,
    etfPct: invested > 0 ? (etfVal / invested) * 100 : 0,
    stkPct: invested > 0 ? (stkVal / invested) * 100 : 0,
    cash, options, total,
    day, dayPct: prevVal > 0 ? (day / prevVal) * 100 : 0, dayKnown,
    weightBase: state.settings.weightBase === 'total' ? total : invested,
    netWorth: total + (ui.account === 'ALL' ? manualNet() : 0)
  };
}
function weightOf(p, totals) { return totals.weightBase > 0 ? (posValue(p) / totals.weightBase) * 100 : 0; }

/* Whole-portfolio totals regardless of the account filter (snapshots, net worth). */
function allTotals() {
  const keep = ui.account; ui.account = 'ALL';
  const t = getPortfolioTotals(false);
  ui.account = keep;
  return t;
}

// ---------- Snapshots: one per day, from imports and refreshes ----------
function takeSnapshot() {
  const t = allTotals();
  if (!state.positions.length && !t.cash) return;
  const byAccount = {};
  getAccountsAll().forEach(a => { byAccount[a] = Math.round(accountTotal(a) * 100) / 100; });
  const prices = {};
  state.positions.forEach(p => { if (!p.valueOnly && posPrice(p)) prices[p.ticker] = Math.round(posPrice(p) * 10000) / 10000; });
  const snap = {
    date: todayStr(),
    total: Math.round(t.total * 100) / 100,
    invested: Math.round(t.invested * 100) / 100,
    cash: Math.round(t.cash * 100) / 100,
    options: Math.round(t.options * 100) / 100,
    manual: Math.round(manualNet() * 100) / 100,
    byAccount, prices
  };
  if (!Array.isArray(state.snapshots)) state.snapshots = [];
  const i = state.snapshots.findIndex(s => s.date === snap.date);
  if (i >= 0) state.snapshots[i] = snap; else state.snapshots.push(snap);
  state.snapshots.sort((a, b) => a.date < b.date ? -1 : 1);
  if (state.snapshots.length > 1500) state.snapshots = state.snapshots.slice(-1500);
}
function getAccountsAll() {
  const keep = ui.account; ui.account = 'ALL';

/* Internet calls. Only two sites: finnhub.io (quotes, earnings, news) and alphavantage.co (price history, ETF holdings).
   Every call is counted per day and stops at the daily limit in Settings. Charts, earnings and news are cached for a day. */

const DAY_MS = 86400000;
const AV_DAILY_FREE = 25;

function apiDay() {
  const t = todayStr();
  if (!state.api || state.api.day !== t) state.api = { day: t, finnhub: 0, av: 0 };
  return state.api;
}
function callsToday() { const a = apiDay(); return a.finnhub + a.av; }
function canCall(site) {
  const a = apiDay();
  const limit = num(state.settings.dailyCallLimit) || 150;
  if (a.finnhub + a.av >= limit) return false;
  if (site === 'av' && a.av >= AV_DAILY_FREE) return false;
  return true;
}
async function getJson(site, url) {
  // Tome's install preview and its hidden test of a new version save nothing, so they make no calls (0.4).
  if (hasTome && tome.preview) { const e = new Error('No calls in a preview'); e.limit = true; throw e; }
  if (!canCall(site)) {
    const e = new Error(site === 'av' && apiDay().av >= AV_DAILY_FREE ? 'Daily chart limit reached (25 a day on a free key)' : 'Daily call limit reached (change it in Settings)');
    e.limit = true;
    throw e;
  }
  apiDay()[site]++;
  saveSoon();
  const res = await fetch(url);
  if (res.status === 429) { const e = new Error('The site asked us to slow down. Try again in a minute.'); e.limit = true; throw e; }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* US market hours, worked out in New York time. */
function marketOpen(now) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(now || new Date());
  const get = t => (parts.find(x => x.type === t) || {}).value;
  const wd = get('weekday');
  const mins = Number(get('hour')) % 24 * 60 + Number(get('minute'));
  if (wd === 'Sat' || wd === 'Sun') return false;
  return mins >= 9 * 60 + 30 && mins <= 16 * 60 + 15;
}

// ---------- Quotes ----------
async function fetchQuote(ticker) {
  const custom = (state.settings.customQuoteUrl || '').trim();
  if (custom) {
    const res = await fetch(custom.replace(/\{TICKER\}/gi, encodeURIComponent(ticker)));
    if (res.ok) {
      const d = await res.json();
      const px = Number(d.price != null ? d.price : d.c);
      if (px > 0) return { price: px, change: d.d != null ? Number(d.d) : (d.change != null ? Number(d.change) : null), pct: d.dp != null ? Number(d.dp) : null };
    }
  }
  const key = (state.settings.finnhubKey || '').trim();
  if (!key) return null;
  const d = await getJson('finnhub', 'https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(ticker) + '&token=' + encodeURIComponent(key));
  if (!d || !(Number(d.c) > 0)) return null;
  return { price: Number(d.c), change: d.d != null ? Number(d.d) : null, pct: d.dp != null ? Number(d.dp) : null };
}
function applyQuote(ticker, q) {
  const at = Date.now();
  state.positions.forEach(p => {
    if (p.ticker !== ticker || p.valueOnly) return;
    p.currentPrice = q.price;
    if (q.change != null) { p.dayChange = q.change; p.dayPct = q.pct; }
    p.quoteAt = at;
  });
  state.watchlist.forEach(w => { if (w.ticker === ticker) { w.currentPrice = q.price; if (q.pct != null) w.dayPct = q.pct; } });
}
function quoteTickers() {
  return Array.from(new Set([
    ...state.positions.filter(canQuote).map(p => p.ticker),
    ...state.watchlist.map(w => w.ticker).filter(t => t && !isCusip(t))
  ]));
}
function hasQuoteSource() { return !!(state.settings.finnhubKey || state.settings.customQuoteUrl); }

async function refreshSingleQuote(p) {

/* Finnhub's free key allows 60 calls a minute, so calls go one a second. */
async function refreshAllQuotes(silent) {
  if (ui.refreshing) return;
  if (!hasQuoteSource()) { if (!silent) toast('Add a Finnhub key in Settings to refresh prices'); return; }
  const tickers = quoteTickers();
  if (!tickers.length) return;
  const room = (num(state.settings.dailyCallLimit) || 150) - callsToday();
  if (!state.settings.customQuoteUrl && room < tickers.length) {
    if (!silent) toast('A refresh needs ' + tickers.length + ' calls and ' + Math.max(0, room) + ' are left today. Raise the limit in Settings.');
    return;
  }
  ui.refreshing = true; ui.refreshDone = 0; ui.refreshTotal = tickers.length;
  renderSummaryBar();
  let updated = 0, stopped = '';
  for (const tk of tickers) {
    if (!ui.refreshing) break;
    try {
      const q = await fetchQuote(tk);
      if (q) { applyQuote(tk, q); updated++; }
    } catch (e) { if (e.limit) { stopped = e.message; break; } }
    ui.refreshDone++;
    renderSummaryBar();
    await new Promise(r => setTimeout(r, state.settings.customQuoteUrl ? 120 : 1050));
  }
  state.lastQuoteRefresh = Date.now();
  ui.refreshing = false;
  takeSnapshot();
  await saveState();
  render();
  if (stopped) toast('Stopped: ' + stopped);
  else if (!silent) toast('Refreshed ' + updated + ' of ' + tickers.length + ' prices');
}

function autoRefreshDue() {
  const s = state.settings;
  const hrs = num(s.refreshHours);
  if (!hrs || !hasQuoteSource() || !state.positions.length) return false;
  if (s.marketHoursOnly && !marketOpen()) return false;
  return Date.now() - num(state.lastQuoteRefresh) > hrs * 3600000;
}

/* ---- 20-import.js ---- */
/* Fidelity Positions CSV import. Smart merge: shares, cost and prices update; thesis, exit notes and decision logs are never touched.
   0.1: core cash and pending activity become each account's cash, option rows become its open options value, and rows
   without a quantity (some work plan funds) come in by their Current value, so the total matches Fidelity's. */

function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cur.trim()); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur.trim());
      if (row.some(c => c !== '')) rows.push(row);
      row = []; cur = '';
    } else cur += ch;
  }
  if (cur.length || row.length) { row.push(cur.trim()); if (row.some(c => c !== '')) rows.push(row); }
  return rows;
}
function cleanNum(s) {
  if (s == null) return NaN;
  const t = String(s).trim();
  if (!t || t === '--' || t === 'n/a') return NaN;
  return parseFloat(t.replace(/[$,%\s+]/g, ''));
}
function isOptionSymbol(sym) { return /^-?\s*[A-Z]{1,6}\d{6}[CP][\d.]+$/i.test(String(sym).trim()); }
function isCashSymbol(sym, desc) {
  return /\*\*$/.test(sym) || /^pending activity$/i.test(sym) || /^(spaxx|fdrxx|fcash|core|spaxx\*\*)$/i.test(sym) || /money market|deposit sweep/i.test(desc || '');
}

function parseFidelityPositions(csvText) {
  const rows = parseCSV(csvText.replace(/^﻿/, ''));
  if (rows.length < 2) return { error: 'This file looks empty.' };
  const headIdx = rows.findIndex(r => r.some(c => /^symbol$/i.test(c)) && r.some(c => /quantity|shares/i.test(c)));
  if (headIdx < 0) return { error: 'Could not find the Symbol and Quantity columns. In Fidelity: Positions, then Download.' };
  const headers = rows[headIdx].map(h => h.toLowerCase().trim());
  const col = re => headers.findIndex(h => re.test(h));
  const iAcct = col(/account name/), iAcctNum = col(/account number/), iSym = col(/^symbol$/), iDesc = col(/description/);
  const iQty = col(/^quantity$|^shares$/), iPrice = col(/last price$/), iChg = col(/last price change/), iVal = col(/current value/);
  const iAvg = col(/average cost basis|cost basis per share/), iCostTot = col(/cost basis total/);

  const items = [], cash = {}, options = {}, optionRows = [], accounts = new Set();
  let skipped = 0, fidelityTotal = 0;
  for (let i = headIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (r.length < 4) { skipped++; continue; }
    const acct = (iAcct >= 0 && r[iAcct]) ? r[iAcct].trim() : ((iAcctNum >= 0 && r[iAcctNum]) ? r[iAcctNum].trim() : '');
    const rawSym = (r[iSym] || '').trim();
    if (!acct || !rawSym || rawSym.length > 24) { skipped++; continue; }
    const desc = iDesc >= 0 ? (r[iDesc] || '').trim() : '';
    const value = iVal >= 0 ? cleanNum(r[iVal]) : NaN;
    accounts.add(acct);
    if (!isNaN(value)) fidelityTotal += value;

    if (isCashSymbol(rawSym, desc)) {
      if (!isNaN(value)) cash[acct] = (cash[acct] || 0) + value;
      continue;
    }
    if (isOptionSymbol(rawSym)) {
      const v = isNaN(value) ? 0 : value;
      options[acct] = (options[acct] || 0) + v;
      optionRows.push({ account: acct, symbol: rawSym.replace(/\s+/g, ''), desc, qty: cleanNum(r[iQty]) || 0, value: v, cost: iCostTot >= 0 ? (cleanNum(r[iCostTot]) || 0) : 0 });
      continue;
    }
    const sym = rawSym.toUpperCase();
    const qty = cleanNum(r[iQty]);
    const price = iPrice >= 0 ? cleanNum(r[iPrice]) : NaN;
    const chg = iChg >= 0 ? cleanNum(r[iChg]) : NaN;
    const costTot = iCostTot >= 0 ? cleanNum(r[iCostTot]) : NaN;
    let avg = iAvg >= 0 ? cleanNum(r[iAvg]) : NaN;
    const isEtf = KNOWN_ETFS.has(sym) || isCusip(sym) || /\b(ETF|ETFS|INDEX|FUND|ISHARES|VANGUARD|SPDR|INVESCO|SCHWAB|TRUST|TR)\b/i.test(desc);

    if (isNaN(qty) || qty <= 0 || isNaN(price)) {
      // No quantity or price (some work plan funds): bring it in by its Current value.
      if (isNaN(value) || value === 0) { skipped++; continue; }
      items.push({ ticker: sym, name: desc, account: acct, shares: 0, avgCost: 0, currentPrice: 0, valueOnly: value, costTotal: isNaN(costTot) ? null : costTot, isEtf, dayChange: null });
      continue;
    }
    if (isNaN(avg) && !isNaN(costTot) && qty > 0) avg = costTot / qty;
    if (isNaN(avg)) avg = price;
    items.push({ ticker: sym, name: desc, account: acct, shares: qty, avgCost: Number(avg.toFixed(4)), currentPrice: price, fidValue: isNaN(value) ? null : value, isEtf, dayChange: isNaN(chg) ? null : chg, dayPct: isNaN(chg) || !(price - chg) ? null : (chg / (price - chg)) * 100 });
  }
  return { items, cash, options, optionRows, accounts: Array.from(accounts), skipped, fidelityTotal };
}

function newPosition(it) {
  return {
    id: uid(), ticker: it.ticker, name: it.name, account: it.account,
    shares: it.shares, avgCost: it.avgCost, currentPrice: it.currentPrice,
    fidValue: it.fidValue != null ? it.fidValue : null, fidPrice: it.currentPrice,
    valueOnly: it.valueOnly || null, costTotal: it.costTotal != null ? it.costTotal : null,
    dayChange: it.dayChange, dayPct: it.dayPct, quoteAt: Date.now(),
    sector: '', tags: [], isEtf: it.isEtf, expenseRatio: null,
    thesis: [], exitStrategy: '', targetPrice: null, stopPrice: null,
    decisionLog: [{ id: uid(), date: todayStr(), note: it.valueOnly ? 'Imported from CSV: value ' + fmtMoney(it.valueOnly) : 'Imported from CSV: ' + it.shares + ' shares @ ' + fmtMoney(it.avgCost) }],
    lastReviewed: todayStr(), manualStatus: null, netOptionPremium: 0
  };
}

/* What an import would do, without changing anything. */
function planImport(res) {
  const key = p => p.ticker + '|' + p.account;
  const incoming = new Map(res.items.map(it => [key(it), it]));
  const update = [], add = [];
  res.items.forEach(it => { (state.positions.some(p => key(p) === key(it)) ? update : add).push(it); });
  const gone = state.positions.filter(p => res.accounts.includes(p.account) && !incoming.has(key(p)));
  return { update, add, gone };
}

function applyImport(res, closeGone) {
  const plan = planImport(res);
  const key = p => p.ticker + '|' + p.account;
  res.items.forEach(it => {
    const match = state.positions.find(p => key(p) === key(it));
    if (!match) { state.positions.push(newPosition(it)); return; }
    match.shares = it.shares;
    match.avgCost = it.avgCost;
    match.currentPrice = it.currentPrice;
    match.fidValue = it.fidValue != null ? it.fidValue : null;
    match.fidPrice = it.currentPrice;
    match.valueOnly = it.valueOnly || null;
    match.costTotal = it.costTotal != null ? it.costTotal : null;
    if (it.dayChange != null) { match.dayChange = it.dayChange; match.dayPct = it.dayPct; }
    match.quoteAt = Date.now();
    if (!match.name && it.name) match.name = it.name;
  });
  if (closeGone) {
    plan.gone.forEach(p => {
      state.closed.unshift({ id: uid(), ticker: p.ticker, name: p.name, account: p.account, shares: num(p.shares), avgCost: num(p.avgCost), sellPrice: posPrice(p), closeDate: todayStr(), lesson: 'No longer in the Fidelity download on ' + todayStr() + ' (price is the last one known).' });
    });
    const goneIds = new Set(plan.gone.map(p => p.id));
    state.positions = state.positions.filter(p => !goneIds.has(p.id));
  }
  // Cash and options: the accounts in this file get their new values; other accounts keep theirs.
  res.accounts.forEach(a => {
    state.cashByAccount[a] = Math.round((res.cash[a] || 0) * 100) / 100;
    state.openOptionsByAccount[a] = Math.round((res.options[a] || 0) * 100) / 100;
  });
  state.openOptions = (state.openOptions || []).filter(o => !res.accounts.includes(o.account)).concat(res.optionRows);
  state.lastImport = Date.now();
  state.remindSnooze = '';
  takeSnapshot();
  return { updated: plan.update.length, added: plan.add.length, closed: closeGone ? plan.gone.length : 0 };
}

/* ---- 30-charts.js ---- */
/* Small SVG charts drawn by hand (no outside libraries): a line chart with hover, reference lines and dots, and a donut. */

const PALETTE = [
  'var(--accent)', 'var(--ok)', 'var(--soon)', 'var(--late)',
  'color-mix(in srgb, var(--accent) 50%, var(--fg))', 'color-mix(in srgb, var(--ok) 50%, var(--fg))',
  'color-mix(in srgb, var(--soon) 50%, var(--fg))', 'color-mix(in srgb, var(--late) 50%, var(--fg))',
  'color-mix(in srgb, var(--accent) 45%, var(--bg))', 'var(--muted)'
];
const SVGNS = 'http://www.w3.org/2000/svg';
const tipEl = () => document.getElementById('chartTip');
function showTip(text, x, y) {
  const t = tipEl(); t.textContent = text; t.hidden = false;
  const w = t.offsetWidth;
  t.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px';
  t.style.top = Math.max(8, y - 34) + 'px';
}
function hideTip() { tipEl().hidden = true; }

function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(Number(v.toFixed(10)));
  return out;
}
function shortDate(d) { const [, m, day] = d.split('-'); return Number(m) + '/' + Number(day); }
function moneyAxis(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e4) return '$' + Math.round(v / 1e3) + 'k';
  if (a >= 1000) return '$' + (v / 1e3).toFixed(1) + 'k';
  if (v === 0) return '$0';
  return '$' + (a >= 100 ? Math.round(v) : v.toFixed(2));
}

/* series: [{ name, color, points: [[date, value]] }]; refs: [{ value, label, cls }]; dots: [{ date, label }] */
function lineChart(box, opts) {
  const series = (opts.series || []).filter(s => s.points && s.points.length);
  box.innerHTML = '';
  if (!series.length || series.every(s => s.points.length < 2)) {
    box.innerHTML = '<div class="chart-empty">' + esc(opts.empty || 'Not enough data yet.') + '</div>';
    return;
  }
  const W = Math.max(320, box.clientWidth || 600), H = opts.height || 210, padL = 54, padR = opts.refs && opts.refs.length ? 74 : 14, padT = 12, padB = 24;
  const dates = Array.from(new Set(series.flatMap(s => s.points.map(p => p[0])))).sort();
  const xi = new Map(dates.map((d, i) => [d, i]));
  let lo = Infinity, hi = -Infinity;
  series.forEach(s => s.points.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }));
  (opts.refs || []).forEach(r => { if (r.value > 0 && r.fit !== false) { lo = Math.min(lo, r.value); hi = Math.max(hi, r.value); } });
  const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1;
  lo -= pad; hi += pad;
  const X = i => padL + (dates.length < 2 ? 0 : (i / (dates.length - 1)) * (W - padL - padR));
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const fmtV = opts.format || moneyAxis;
  let s = '';
  niceTicks(lo, hi, 5).forEach(t => { s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${padL - 6}" y="${Y(t) + 3.5}" text-anchor="end">${esc(fmtV(t))}</text>`; });
  const nLab = Math.min(6, dates.length);
  for (let k = 0; k < nLab; k++) {
    const i = Math.round(k * (dates.length - 1) / Math.max(1, nLab - 1));
    s += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === nLab - 1 ? 'end' : 'middle'}">${esc(shortDate(dates[i]))}</text>`;
  }
  (opts.refs || []).forEach(r => {
    if (!(r.value > lo && r.value < hi)) return;
    s += `<line class="ref ${r.cls}" x1="${padL}" x2="${W - padR}" y1="${Y(r.value)}" y2="${Y(r.value)}"/><text class="ref-label" x="${W - padR + 4}" y="${Y(r.value) + 3.5}" style="fill:${r.color || 'var(--muted)'}">${esc(r.label)}</text>`;
  });
  series.forEach((ser, n) => {
    const pts = ser.points.map(p => [X(xi.get(p[0])), Y(p[1])]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const color = ser.color || PALETTE[n % PALETTE.length];
    if (series.length === 1 && opts.area !== false) s += `<path class="area" style="fill:${color}" d="${d} L${pts[pts.length - 1][0].toFixed(1)} ${H - padB} L${pts[0][0].toFixed(1)} ${H - padB} Z"/>`;
    s += `<path class="line" style="stroke:${color}" d="${d}"/>`;
  });
  const main = series[0];
  const mainMap = new Map(main.points);
  (opts.dots || []).forEach(dt => {
    const day = dates.find(d => d >= dt.date);
    if (!day || !mainMap.has(day) || dt.date < dates[0]) return;
    s += `<circle class="dot" cx="${X(xi.get(day))}" cy="${Y(mainMap.get(day))}" r="4.5" data-tip="${esc(dt.date + ': ' + dt.label)}"/>`;
  });
  s += `<line class="cross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/><circle class="hover-dot" r="4" visibility="hidden"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Chart')}">${s}</svg>`;
  const svg = box.querySelector('svg'), cross = svg.querySelector('.cross'), hd = svg.querySelector('.hover-dot');
  svg.addEventListener('pointermove', e => {
    const dot = e.target.closest && e.target.closest('.dot');
    if (dot) { showTip(dot.dataset.tip, e.clientX, e.clientY); cross.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); return; }
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(dates.length - 1, Math.round((x - padL) / ((W - padL - padR) / Math.max(1, dates.length - 1)))));
    const day = dates[i];
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    if (mainMap.has(day)) { hd.setAttribute('cx', X(i)); hd.setAttribute('cy', Y(mainMap.get(day))); hd.setAttribute('visibility', 'visible'); }
    const parts = series.map(ser => { const m = ser.points.find(p => p[0] === day); return m ? (series.length > 1 ? ser.name + ' ' : '') + (opts.tipFormat || fmtMoney)(m[1]) : null; }).filter(Boolean);
    showTip(day + '  ' + parts.join('  '), e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => { hideTip(); cross.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); });
}

/* items: [{ label, val }] sorted big to small; the rest fold into "Other" after max. */
function donut(box, items, opts) {
  opts = opts || {};
  const max = opts.max || 7;
  let list = items.filter(x => x.val > 0);
  if (list.length > max) {
    const rest = list.slice(max - 1).reduce((s, x) => s + x.val, 0);
    list = list.slice(0, max - 1).concat([{ label: 'Other', val: rest }]);
  }
  const total = list.reduce((s, x) => s + x.val, 0);
  if (!total) { box.innerHTML = '<div class="chart-empty">No data yet.</div>'; return; }
  const R = 52, r = 32, C = 60;
  let a0 = -Math.PI / 2, paths = '';
  list.forEach((x, i) => {
    const frac = x.val / total, a1 = a0 + frac * Math.PI * 2, large = frac > 0.5 ? 1 : 0;
    const p = (a, rad) => (C + rad * Math.cos(a)).toFixed(2) + ' ' + (C + rad * Math.sin(a)).toFixed(2);
    const col = PALETTE[i % PALETTE.length];
    const tip = x.label + ': ' + fmtMoneyShort(x.val) + ' (' + (frac * 100).toFixed(1) + '%)';
    if (frac >= 0.9999) paths += `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke-width="${R - r}" style="stroke:${col}" data-tip="${esc(tip)}"/>`;
    else paths += `<path d="M${p(a0, R)} A${R} ${R} 0 ${large} 1 ${p(a1, R)} L${p(a1, r)} A${r} ${r} 0 ${large} 0 ${p(a0, r)} Z" style="fill:${col}" data-tip="${esc(tip)}"/>`;
    a0 = a1;
  });
  const center = opts.center ? `<text x="${C}" y="${C + 4}" text-anchor="middle" style="font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--fg)">${esc(opts.center)}</text>` : '';
  box.innerHTML = `<div class="donut-wrap"><svg viewBox="0 0 120 120">${paths}${center}</svg><div class="donut-list">${list.map((x, i) =>
    `<div class="row" data-label="${esc(x.label)}"><i style="background:${PALETTE[i % PALETTE.length]}"></i><span class="lbl" title="${esc(x.label)}">${esc(x.label)}</span><span class="pct">${(x.val / total * 100).toFixed(1)}%</span></div>`).join('')}</div></div>`;
  box.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('pointermove', e => showTip(el.dataset.tip, e.clientX, e.clientY));
    el.addEventListener('pointerleave', hideTip);
  });
  if (opts.onPick) box.querySelectorAll('.donut-list .row').forEach(row => { row.style.cursor = 'pointer'; row.onclick = () => opts.onPick(row.dataset.label); });
}

function posCardHtml(p, totals, opts) {

}

// ---------- Price chart ----------
function chartPoints(p) {
  const c = state.cache.chart[p.ticker];
  if (c && c.points && c.points.length > 1) return { points: c.points.slice(), source: 'Daily closes from Alpha Vantage' };
  const own = (state.snapshots || []).filter(s => s.prices && s.prices[p.ticker]).map(s => [s.date, s.prices[p.ticker]]);
  return { points: own, source: 'Your own price history (from imports and refreshes)' };
}
function chartCard(p) {
  const card = document.createElement('div');
  card.className = 'panel-card';
  const key = 'chart:' + p.ticker;
  const hasKey = !!state.settings.alphaVantageKey;
  const cached = state.cache.chart[p.ticker];
  if (hasKey && canQuote(p) && state.settings.autoChart && !chartFresh(cached) && !loading.has(key) && !loadErr[key]) loadChart(p);
  const { points, source } = chartPoints(p);
  const ranges = { '1m': 22, '3m': 66, all: 9999 };
  const pts = points.slice(-ranges[ui.chartRange] || -9999);
  card.innerHTML = `
    <div class="panel-head">
      <h4 class="panel-title">Price</h4>
      <div class="chip-row">${['1m', '3m', 'all'].map(r => `<button class="pill ${ui.chartRange === r ? 'on' : ''}" data-r="${r}">${r === 'all' ? 'All' : r.toUpperCase()}</button>`).join('')}
        ${hasKey && canQuote(p) && !state.settings.autoChart && !chartFresh(cached) ? '<button class="pill" data-load="1">Load chart</button>' : ''}</div>
    </div>
    <div class="chart"></div>
    <div class="note-line">${loading.has(key) ? 'Loading price history...' : loadErr[key] ? esc(loadErr[key]) : esc(source) + (p.decisionLog && p.decisionLog.length ? '. Dots are decision log entries.' : '')}</div>`;
  card.querySelectorAll('[data-r]').forEach(b => { b.onclick = () => { ui.chartRange = b.dataset.r; render(); }; });
  const lb = card.querySelector('[data-load]'); if (lb) lb.onclick = () => loadChart(p);
  const refs = [{ value: num(p.avgCost), label: 'Cost ' + moneyAxis(num(p.avgCost)), cls: 'ref-cost' }];
  if (num(p.targetPrice)) refs.push({ value: num(p.targetPrice), label: 'Target', cls: 'ref-target', color: 'var(--ok)', fit: false });
  if (num(p.stopPrice)) refs.push({ value: num(p.stopPrice), label: 'Stop', cls: 'ref-stop', color: 'var(--late)', fit: false });
  requestAnimationFrame(() => lineChart(card.querySelector('.chart'), {
    series: [{ name: p.ticker, points: pts }], refs, height: 200, label: p.ticker + ' price',
    dots: (p.decisionLog || []).map(e => ({ date: e.date, label: e.note })),
    empty: hasKey ? (canQuote(p) ? 'No price history yet.' : 'This holding has no ticker to chart.') : 'Add a free Alpha Vantage key in Settings for a price chart. Until then the chart builds from your own imports and refreshes.'
  }));
  return card;
}
async function loadChart(p) {
  const key = 'chart:' + p.ticker;
  if (loading.has(key)) return;
  loading.add(key);
  try { await fetchChart(p.ticker); delete loadErr[key]; }
  catch (e) { loadErr[key] = e.message; }
  loading.delete(key);
  if (ui.view === 'positions' && ui.selectedId === p.id) render();
}

function acrossCard(p, totals) {
  const card = document.createElement('div');
  card.className = 'panel-card';
  const same = state.positions.filter(x => x.ticker === p.ticker);
  const shares = same.reduce((s, x) => s + num(x.shares), 0);
  const value = same.reduce((s, x) => s + posValue(x), 0);
  const cost = same.reduce((s, x) => s + posCost(x), 0);
  const via = [];
  state.positions.filter(x => x.isEtf).forEach(e => {
    const h = ((state.etfCache[e.ticker] || {}).holdings || []).find(h => h.symbol.toUpperCase() === p.ticker);
    if (h) via.push({ etf: e.ticker, account: e.account, val: posValue(e) * num(h.weight) / 100, w: num(h.weight) });
  });
  const viaVal = via.reduce((s, x) => s + x.val, 0);
  const all = allTotals();
  card.innerHTML = `
    <div class="panel-head"><h4 class="panel-title">${esc(p.ticker)} across your accounts</h4><span class="sub" style="font-size:calc(11.5px * var(--fs));">All accounts</span></div>

      ${same.map(x => `<tr class="click" data-id="${x.id}"><td>${esc(shortAcct(x.account))}</td><td class="num">${fmtShares(x.shares)}</td><td class="num">${fmtMoney(x.avgCost)}</td><td class="num">${fmtMoney(posValue(x))}</td><td class="num ${cls(posPnl(x))}">${fmtSigned(posPnl(x), true)}</td></tr>`).join('')}
      ${same.length > 1 ? `<tr><td><b>Combined</b></td><td class="num"><b>${fmtShares(shares)}</b></td><td class="num" title="Blended cost per share">${shares ? fmtMoney(cost / shares) : '-'}</td><td class="num"><b>${fmtMoney(value)}</b></td><td class="num ${cls(value - cost)}">${fmtSigned(value - cost, true)}</td></tr>` : ''}
      ${via.map(v => `<tr><td class="sub">Through ${esc(v.etf)} (${esc(shortAcct(v.account))}, ${v.w.toFixed(1)}%)</td><td></td><td></td><td class="num">${fmtMoney(v.val)}</td><td></td></tr>`).join('')}

    <div class="note-line">Total exposure ${fmtMoney(value + viaVal)}, ${all.invested ? ((value + viaVal) / all.invested * 100).toFixed(1) : '0'}% of everything you have invested${via.length ? '' : '. ETF look-through appears once your ETFs have holdings (ETFs tab)'}.</div>`;
  card.querySelectorAll('tr[data-id]').forEach(tr => { tr.onclick = () => { ui.selectedId = tr.dataset.id; if (ui.account !== 'ALL') ui.account = 'ALL'; render(); }; });
  return card;
}

// ---------- Trim and target planner ----------
function plannerCard(p, totals) {
  const card = document.createElement('div');
  card.className = 'panel-card';
  const price = posPrice(p), cost = num(p.avgCost), tgt = num(p.targetPrice), stop = num(p.stopPrice);
  const max = num(state.settings.maxStockPct) || 10;
  const wt = weightOf(p, totals), base = totals.weightBase;
  const val = posValue(p);
  let trim = '';
  if (base > 0 && price > 0) {
    const maxVal = base * max / 100;
    if (val > maxVal) { const sh = (val - maxVal) / price; trim = `Over your ${max}% limit: sell about <b>${fmtShares(Math.ceil(sh * 100) / 100)}</b> shares (<b>${fmtMoney(val - maxVal)}</b>) to get back to ${max}%.`; }
    else trim = `Room to add about <b>${fmtMoney(maxVal - val)}</b> (${fmtShares(Math.floor((maxVal - val) / price * 100) / 100)} shares) before your ${max}% limit.`;
  }
  const marks = [{ v: price, label: 'Now ' + moneyAxis(price), color: 'var(--accent)' }, { v: cost, label: 'Cost ' + moneyAxis(cost), color: 'var(--muted)', below: true }];
  if (tgt) marks.push({ v: tgt, label: 'Target ' + moneyAxis(tgt), color: 'var(--ok)' });
  if (stop) marks.push({ v: stop, label: 'Stop ' + moneyAxis(stop), color: 'var(--late)', below: true });
  const vals = marks.map(m => m.v).filter(v => v > 0);
  // Flip a label to the other side when it would run into its neighbor.
  const lastPos = { up: -99, down: -99 };
  marks.filter(m => m.v > 0).sort((a, b) => a.v - b.v).forEach(m => {
    const pos = (m.v - Math.min(...vals) * 0.96) / ((Math.max(...vals) * 1.04 - Math.min(...vals) * 0.96) || 1) * 84;
    let side = m.below ? 'down' : 'up';
    if (pos - lastPos[side] < 22) side = side === 'up' ? 'down' : 'up';
    m.below = side === 'down';
    lastPos[side] = pos;
  });
  const lo = Math.min(...vals) * 0.96, hi = Math.max(...vals) * 1.04;
  const X = v => (8 + (v - lo) / (hi - lo || 1) * 84).toFixed(2) + '%';   // 8% to 92% so labels stay inside
  const lines = [];
  if (tgt && price) lines.push(`To target: <b class="${cls(tgt - price)}">${fmtPct((tgt / price - 1) * 100, true)}</b>, position would be <b>${fmtMoney(num(p.shares) * tgt)}</b> (${fmtSigned(num(p.shares) * (tgt - cost), true)} total gain).`);
  if (stop && price) lines.push(`To stop: <b class="${cls(stop - price)}">${fmtPct((stop / price - 1) * 100, true)}</b>, a drop of <b>${fmtMoney(num(p.shares) * (price - stop))}</b>.`);
  if (trim) lines.push(trim);
  card.innerHTML = `
    <div class="panel-head"><h4 class="panel-title">Plan</h4><span class="sub" style="font-size:calc(11.5px * var(--fs));">Weight ${wt.toFixed(1)}% of ${max}% max</span></div>
    <div class="range-bar">
      ${stop ? `<div class="seg" style="left:0;width:${X(stop)};background:var(--late-soft)"></div>` : ''}
      ${tgt ? `<div class="seg" style="left:${X(tgt)};right:0;background:color-mix(in srgb, var(--ok) 20%, transparent)"></div>` : ''}
      ${marks.filter(m => m.v > 0).map(m => `<div class="mark ${m.below ? 'below' : ''}" style="left:${X(m.v)};background:${m.color}"><span style="color:${m.color}">${esc(m.label)}</span></div>`).join('')}
    </div>
    <div class="plan-inputs">
      <label>Target price<input id="planTarget" type="number" step="any" min="0" value="${tgt || ''}" placeholder="e.g. ${price ? (price * 1.25).toFixed(2) : ''}"></label>
      <label>Stop price<input id="planStop" type="number" step="any" min="0" value="${stop || ''}" placeholder="e.g. ${price ? (price * 0.85).toFixed(2) : ''}"></label>
    </div>
    <div class="plan-out">${lines.join('<br>') || '<span class="sub">Set a target and a stop to see how far away they are.</span>'}</div>`;
  const bind = (id, field) => {
    const inp = card.querySelector('#' + id);
    const commit = () => { const c = livePos(p); const v = parseFloat(inp.value); const nv = isNaN(v) || v <= 0 ? null : v; if (nv !== (c[field] || null)) { c[field] = nv; saveState(); render(); } };
    inp.onchange = commit;
    inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  };
  bind('planTarget', 'targetPrice');
  bind('planStop', 'stopPrice');
  return card;
}

// ---------- Earnings and news ----------
function newsCard(p) {

  const hasKey = !!state.settings.finnhubKey;
  const earn = state.cache.earn[p.ticker], news = state.cache.news[p.ticker];
  const fresh = c => c && Date.now() - num(c.at) < DAY_MS;
  if (hasKey && canQuote(p) && state.settings.autoNews) {
    if (!fresh(earn) && !loading.has('earn:' + p.ticker) && !loadErr['earn:' + p.ticker]) loadSide(p, 'earn');
    if (!fresh(news) && !loading.has('news:' + p.ticker) && !loadErr['news:' + p.ticker]) loadSide(p, 'news');
  }
  let earnHtml = '<span class="sub">-</span>';
  if (earn) {
    if (earn.next) {
      const dd = daysSince(earn.next.date) * -1;
      const when = earn.next.hour === 'bmo' ? ' before the open' : earn.next.hour === 'amc' ? ' after the close' : '';
      earnHtml = `<b>${esc(earn.next.date)}</b>${esc(when)} <span class="sub">(${dd <= 0 ? 'today' : 'in ' + dd + ' days'}${earn.next.epsEstimate != null ? ', EPS estimate ' + Number(earn.next.epsEstimate).toFixed(2) : ''})</span>`;
    } else earnHtml = '<span class="sub">None scheduled in the next 4 months</span>';
  } else if (loading.has('earn:' + p.ticker)) earnHtml = '<span class="sub">Loading...</span>';
  const items = news && news.items || [];
  card.innerHTML = `
    <div class="panel-head"><h4 class="panel-title">Earnings and news</h4>${hasKey && !state.settings.autoNews ? '<button class="pill" data-load="1">Load</button>' : ''}</div>
    ${!hasKey ? '<div class="sub">Add a free Finnhub key in Settings to see the next earnings date and recent headlines.</div>' : `
    <div class="earn-line">Next earnings: ${earnHtml}</div>
    <div class="news-list">${items.length ? items.slice(0, 5).map(n => `<div class="news-item" data-u="${esc(n.u)}" title="${esc(n.u ? 'Open the article' : '')}"><span class="h">${esc(n.h)}</span><span class="m">${esc(n.s)}${n.t ? ' · ' + new Date(n.t).toLocaleDateString() : ''}</span></div>`).join('')
      : `<div class="sub">${loading.has('news:' + p.ticker) ? 'Loading headlines...' : loadErr['news:' + p.ticker] ? esc(loadErr['news:' + p.ticker]) : news ? 'No headlines this week.' : ''}</div>`}</div>`}`;
  card.querySelectorAll('.news-item').forEach(n => { n.onclick = () => { if (n.dataset.u) openUrl(n.dataset.u); }; });
  const lb = card.querySelector('[data-load]'); if (lb) lb.onclick = () => { loadSide(p, 'earn'); loadSide(p, 'news'); };
  return card;
}
async function loadSide(p, kind) {
  const key = kind + ':' + p.ticker;
  if (loading.has(key)) return;
  loading.add(key);
  try { await (kind === 'earn' ? fetchEarnings(p.ticker) : fetchNews(p.ticker)); delete loadErr[key]; }
  catch (e) { loadErr[key] = e.message; }
  loading.delete(key);
  if (ui.view === 'positions' && ui.selectedId === p.id) render();
}

function thesisExitCards(p) {
  const thesisItems = Array.isArray(p.thesis) ? p.thesis : [];
  const checked = thesisItems.filter(t => t.checked).length;
  const grid = document.createElement('div');
  grid.className = 'detail-grid';
  grid.innerHTML = `
    <div class="panel-card">
      <div class="panel-head"><h4 class="panel-title">Why I bought (thesis health: ${checked}/${thesisItems.length})</h4></div>
      <div id="thesisList" class="thesis-list"></div>
      <div class="quick-add-row"><input id="thesisAddInput" placeholder="+ Add a thesis point (Enter)..." /><button id="thesisAddBtn" class="quiet" style="padding:4px 10px;">Add</button></div>
    </div>
    <div class="panel-card">
      <div class="panel-head"><h4 class="panel-title">Exit strategy</h4><span class="sub" style="font-size:calc(11.5px * var(--fs));">Saves as you type</span></div>
      <textarea id="exitNotes" class="exit-textarea" placeholder="Your rules for trimming or selling (e.g. trim 25% if weight goes over 12%, exit if the thesis breaks)...">${esc(p.exitStrategy || '')}</textarea>
    </div>`;
  const tList = grid.querySelector('#thesisList');
  if (!thesisItems.length) tList.innerHTML = '<div class="sub" style="padding:6px 2px;">No thesis points yet. Add 2 or 3 reasons you bought this stock.</div>';
  thesisItems.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'thesis-item' + (item.checked ? '' : ' broken');
    row.innerHTML = `<input type="checkbox" ${item.checked ? 'checked' : ''} /><span class="thesis-text">${esc(item.text)}</span><button class="row-del-btn" title="Remove">&times;</button>`;
    row.querySelector('input').onchange = ev => { item.checked = ev.target.checked; p.lastReviewed = todayStr(); saveState(); render(); };
    row.querySelector('.row-del-btn').onclick = () => { p.thesis.splice(idx, 1); saveState(); render(); };
    tList.appendChild(row);
  });
  const add = () => {
    p = livePos(p);
    const inp = grid.querySelector('#thesisAddInput'), txt = inp.value.trim();
    if (!txt) return;
    if (!p.thesis) p.thesis = [];
    p.thesis.push({ id: uid(), text: txt, checked: true });
    p.lastReviewed = todayStr(); saveState(); render();
  };
  grid.querySelector('#thesisAddBtn').onclick = add;
  grid.querySelector('#thesisAddInput').onkeydown = e => { if (e.key === 'Enter') add(); };
  // Always write to the current copy of the position (a sync from another PC can replace it while you type).
  const ex = grid.querySelector('#exitNotes');
  const commitExit = () => { const c = livePos(p); if (c.exitStrategy !== ex.value) { c.exitStrategy = ex.value; saveSoon(); } };
  ex.oninput = commitExit;
  ex.addEventListener('blur', commitExit);
  return grid;
}

/* ETFs view (from 1.0): fund cards with value and P&L, pairwise overlap, and look-through exposure. */
function renderEtfsView(ws) {
  const totals = getPortfolioTotals(true);
  const etfs = getFilteredPositions({ onlyEtfs: true });
  etfs.sort((a, b) => posValue(b) - posValue(a));

  const left = document.createElement('div');
  left.className = 'pane-left';
  left.innerHTML = `
    <div>
      <div style="font-weight:700;font-size:calc(15px * var(--fs));">ETFs and funds (${etfs.length}): ${fmtMoneyShort(totals.etfVal)}</div>
      <div class="sub" style="font-size:calc(11.5px * var(--fs));margin-top:2px;">Untick one to preview "what if I sold it". Click for holdings</div>
    </div>
    <div id="etfList" class="scroll-list"></div>
    <div style="display:flex;gap:6px;flex-shrink:0;">
      <button id="btnAddEtf" class="primary" style="flex:1;font-size:calc(12px * var(--fs));">+ Add ETF</button>
      <button id="btnRefEtf" class="quiet" style="flex:1;font-size:calc(12px * var(--fs));">Refresh holdings</button>
    </div>
  `;
  ws.appendChild(left);

  left.querySelector('#btnAddEtf').onclick = () => openPositionModal(null, true);
  left.querySelector('#btnRefEtf').onclick = () => refreshAllEtfHoldings(etfs);

  const listEl = left.querySelector('#etfList');
  if (etfs.length === 0) {
    listEl.innerHTML = `<div class="tome-empty" style="padding:20px 10px;text-align:center;">
      <div style="margin-bottom:6px;">No ETFs tracked yet.</div>
      <div class="sub">Add an ETF or right-click any stock to move it here.</div>
    </div>`;
  } else {
    etfs.forEach(p => {
      const excluded = ui.whatIfExcluded.has(p.id);
      const cache = state.etfCache[p.ticker] || {};
      const er = p.expenseRatio != null && p.expenseRatio !== '' ? Number(p.expenseRatio) : (cache.expenseRatio != null ? Number(cache.expenseRatio) : null);
      const holdingsCount = (cache.holdings || []).length;

      const card = document.createElement('div');
      card.className = 'pos-card' + (excluded ? ' muted-card' : '');
      card.innerHTML = posCardHtml(p, totals, { check: true, excluded }) + `<div class="pos-acct">${er != null ? er.toFixed(2) + '% fee' : 'No fee set'} &middot; ${holdingsCount ? holdingsCount + ' holdings' : 'No holdings yet'}</div>`;
      const cb = card.querySelector('input[type="checkbox"]');
      cb.onclick = (ev) => {
        ev.stopPropagation();
        if (cb.checked) ui.whatIfExcluded.delete(p.id);
        else ui.whatIfExcluded.add(p.id);
        render();
      };
      card.onclick = () => openEtfHoldingsModal(p);
      card.oncontextmenu = (ev) => openPositionContextMenu(ev, p);
      listEl.appendChild(card);
    });
  }

  // Right Pane: Overlap Matrix + True Look-Through Exposure
  const right = document.createElement('div');
  right.className = 'pane-right';
  ws.appendChild(right);

  const activeEtfs = etfs.filter(p => !ui.whatIfExcluded.has(p.id));
  // Deduplicate ETF tickers for pairwise overlap
  const uniqueEtfMap = new Map();
  activeEtfs.forEach(p => {
    if (!uniqueEtfMap.has(p.ticker)) uniqueEtfMap.set(p.ticker, p);
  });
  const uniqueEtfs = Array.from(uniqueEtfMap.values());

  // 1. Overlap Matrix Card
  const overlapCard = document.createElement('div');
  overlapCard.className = 'panel-card';
  overlapCard.innerHTML = `
    <div class="panel-head">
      <h4 class="panel-title">Overlap Matrix (Pairwise Weight Overlap)</h4>
      <span class="sub" style="font-size:calc(11px * var(--fs));">Click any ETF on the left to edit or paste holdings</span>
    </div>
    <div id="overlapBody" style="display:flex;flex-direction:column;gap:8px;"></div>
  `;
  right.appendChild(overlapCard);

  const ob = overlapCard.querySelector('#overlapBody');
  const pairs = [];
  for (let i = 0; i < uniqueEtfs.length; i++) {
    for (let j = i + 1; j < uniqueEtfs.length; j++) {
      const a = uniqueEtfs[i], b = uniqueEtfs[j];
      const hA = (state.etfCache[a.ticker] && state.etfCache[a.ticker].holdings) || [];
      const hB = (state.etfCache[b.ticker] && state.etfCache[b.ticker].holdings) || [];
      if (!hA.length || !hB.length) continue;
      const mapB = new Map();
      hB.forEach(h => mapB.set(h.symbol.toUpperCase(), Number(h.weight) || 0));
      let overlap = 0;
      let sharedCount = 0;
      hA.forEach(h => {
        const sym = h.symbol.toUpperCase();
        if (mapB.has(sym)) {
          overlap += Math.min(Number(h.weight) || 0, mapB.get(sym));
          sharedCount++;
        }
      });
      const erA = a.expenseRatio != null && a.expenseRatio !== '' ? Number(a.expenseRatio) : (state.etfCache[a.ticker] && state.etfCache[a.ticker].expenseRatio);
      const erB = b.expenseRatio != null && b.expenseRatio !== '' ? Number(b.expenseRatio) : (state.etfCache[b.ticker] && state.etfCache[b.ticker].expenseRatio);
      pairs.push({ a: a.ticker, b: b.ticker, overlap: Math.min(100, overlap), sharedCount, erA, erB });
    }
  }
  pairs.sort((x, y) => y.overlap - x.overlap);

  if (pairs.length === 0) {
    ob.innerHTML = `<div class="sub">Add at least two ETFs with holdings data (via Alpha Vantage in Settings or by clicking an ETF to paste holdings) to see pairwise overlap.</div>`;
  } else {
    pairs.forEach(pr => {
      const high = pr.overlap >= 50;
      const feeText = (pr.erA != null || pr.erB != null)
        ? `${pr.erA != null ? Number(pr.erA).toFixed(2) + '%' : '?'} vs ${pr.erB != null ? Number(pr.erB).toFixed(2) + '%' : '?'} fee`
        : `${pr.sharedCount} shared holdings`;
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-row-head">
          <div style="display:flex;align-items:center;gap:8px;">
            <strong>${esc(pr.a)} + ${esc(pr.b)}: ${pr.overlap.toFixed(0)}% overlap</strong>
            ${high ? '<span class="badge exit">High - Consolidate?</span>' : ''}
          </div>
          <span class="sub" style="font-family:var(--mono);font-size:calc(11.5px * var(--fs));">${esc(feeText)}</span>
        </div>
        <div class="bar-track">
          <div class="${high ? 'bar-fill-high' : 'bar-fill-etf'}" style="width:${pr.overlap}%"></div>
        </div>
      `;
      ob.appendChild(row);
    });
  }

  // 2. True Look-Through Exposure Card
  const ltCard = document.createElement('div');
  ltCard.className = 'panel-card';
  ltCard.innerHTML = `
    <div class="panel-head">
      <h4 class="panel-title">True Look-Through Exposure (ETFs + Direct Stocks)</h4>
      <span class="sub" style="font-size:calc(11px * var(--fs));">Green = Direct Stock &middot; Accent = Via ETFs</span>
    </div>
    <div id="lookThroughBody" style="display:flex;flex-direction:column;gap:8px;"></div>
  `;
  right.appendChild(ltCard);

  const ltMap = new Map(); // symbol -> { directVal, etfVal, via: Set }
  const addExp = (sym, directV, etfV, viaTicker) => {
    const k = sym.toUpperCase();
    if (!ltMap.has(k)) ltMap.set(k, { symbol: k, directVal: 0, etfVal: 0, via: new Set() });
    const rec = ltMap.get(k);
    rec.directVal += directV;
    rec.etfVal += etfV;
    if (viaTicker) rec.via.add(viaTicker);
  };

  getFilteredPositions({ onlyStocks: true }).forEach(p => {
    addExp(p.ticker, posValue(p), 0, null);
  });
  activeEtfs.forEach(p => {
    const v = posValue(p);
    const cache = state.etfCache[p.ticker];
    if (cache && Array.isArray(cache.holdings) && cache.holdings.length) {
      cache.holdings.forEach(h => {
        const w = (Number(h.weight) || 0) / 100;
        if (w > 0) addExp(h.symbol, 0, v * w, p.ticker);
      });
    }
  });

  const ltArr = Array.from(ltMap.values())
    .map(r => ({
      ...r,
      totalVal: r.directVal + r.etfVal,
      directPct: totals.totalVal > 0 ? (r.directVal / totals.totalVal) * 100 : 0,
      etfPct: totals.totalVal > 0 ? (r.etfVal / totals.totalVal) * 100 : 0,
      totalPct: totals.totalVal > 0 ? ((r.directVal + r.etfVal) / totals.totalVal) * 100 : 0
    }))
    .sort((a, b) => b.totalPct - a.totalPct)
    .slice(0, 12);

  const ltb = ltCard.querySelector('#lookThroughBody');
  if (ltArr.length === 0) {
    ltb.innerHTML = `<div class="sub">No exposure data yet.</div>`;
  } else {
    const maxStock = Number(state.settings.maxStockPct) || 10;
    const scaleMax = Math.max(20, ltArr[0].totalPct * 1.15);
    ltArr.forEach(item => {
      const viaList = Array.from(item.via).join('/');
      const over = item.totalPct > maxStock;
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-row-head">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <strong>${esc(item.symbol)}: ${item.totalPct.toFixed(1)}%</strong>
            <span class="sub">(${item.directPct.toFixed(1)}% direct + ${item.etfPct.toFixed(1)}% via ${viaList || 'ETFs'})</span>
            ${over ? '<span class="badge warn">Over Cap</span>' : ''}
          </div>
          <span class="sub" style="font-family:var(--mono);">${fmtMoneyShort(item.totalVal)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill-direct" style="width:${(item.directPct / scaleMax) * 100}%"></div>
          <div class="bar-fill-etf" style="width:${(item.etfPct / scaleMax) * 100}%"></div>
        </div>
      `;
      ltb.appendChild(row);
    });
  }
}

  const full = document.createElement('div');

function previousSnapshot() {
  const snaps = (state.snapshots || []).filter(s => s.date < todayStr());
  return snaps.length ? snaps[snaps.length - 1] : null;
}

function historyCard() {
  const card = document.createElement('div');
  card.className = 'panel-card';
  const snaps = state.snapshots || [];
  const isAll = ui.account === 'ALL';
  const opts = isAll ? [['total', 'Fidelity total'], ['networth', 'Net worth'], ['invested', 'Invested'], ['accounts', 'By account']] : [['account', shortAcct(ui.account)]];
  if (!opts.some(o => o[0] === ui.historySeries)) ui.historySeries = opts[0][0];
  const ranges = [['1m', 31], ['3m', 92], ['1y', 366], ['all', 99999]];
  const from = addDays(todayStr(), -(ranges.find(r => r[0] === ui.historyRange) || ranges[3])[1]);
  const inRange = snaps.filter(s => s.date >= from);
  let series = [];
  if (ui.historySeries === 'accounts') {
    const names = Array.from(new Set(inRange.flatMap(s => Object.keys(s.byAccount || {}))));
    names.sort((a, b) => num((inRange[inRange.length - 1].byAccount || {})[b]) - num((inRange[inRange.length - 1].byAccount || {})[a]));
    series = names.slice(0, 8).map(n => ({ name: shortAcct(n), points: inRange.filter(s => s.byAccount && s.byAccount[n] != null).map(s => [s.date, s.byAccount[n]]) }));
  } else if (ui.historySeries === 'account') {
    series = [{ name: shortAcct(ui.account), points: inRange.filter(s => s.byAccount && s.byAccount[ui.account] != null).map(s => [s.date, s.byAccount[ui.account]]) }];
  } else {
    const f = { total: s => s.total, networth: s => s.total + num(s.manual), invested: s => s.invested }[ui.historySeries];
    series = [{ name: ui.historySeries, points: inRange.map(s => [s.date, f(s)]) }];
  }
  card.innerHTML = `
    <div class="panel-head">
      <h4 class="panel-title">Value over time</h4>
      <div class="chip-row">${opts.map(o => `<button class="pill ${ui.historySeries === o[0] ? 'on' : ''}" data-s="${o[0]}">${esc(o[1])}</button>`).join('')}
        <span style="width:8px"></span>${ranges.map(r => `<button class="pill ${ui.historyRange === r[0] ? 'on' : ''}" data-r="${r[0]}">${r[0] === 'all' ? 'All' : r[0].toUpperCase()}</button>`).join('')}</div>
    </div>
    <div class="chart"></div>
    ${ui.historySeries === 'accounts' ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}
    <div class="note-line">One point a day, saved when you import a CSV, refresh prices, or open Stocks Hub. ${snaps.length} day${snaps.length === 1 ? '' : 's'} saved so far.</div>`;

function moversCard(list) {
  const card = document.createElement('div');
  card.className = 'panel-card';
  const byT = new Map();
  list.forEach(p => {
    if (p.dayChange == null || p.valueOnly) return;
    const r = byT.get(p.ticker) || { ticker: p.ticker, pct: num(p.dayPct), day: 0, val: 0, id: p.id, isEtf: p.isEtf };
    r.day += posDay(p); r.val += posValue(p);
    byT.set(p.ticker, r);
  });
  const rows = Array.from(byT.values());
  const up = rows.filter(r => r.pct > 0).sort((a, b) => b.pct - a.pct).slice(0, 5);
  const down = rows.filter(r => r.pct < 0).sort((a, b) => a.pct - b.pct).slice(0, 5);
  const newest = Math.max(0, ...list.map(p => num(p.quoteAt)));
  const tr = r => `<tr class="click" data-id="${r.id}" data-etf="${r.isEtf ? 1 : ''}"><td><b>${esc(r.ticker)}</b></td><td class="num ${cls(r.pct)}">${fmtPct(r.pct, true)}</td><td class="num ${cls(r.day)}">${fmtSigned(r.day, true)}</td><td class="num sub">${fmtMoneyShort(r.val)}</td></tr>`;
  card.innerHTML = `
    <div class="panel-head"><h4 class="panel-title">Today's movers</h4><span class="sub" style="font-size:calc(11.5px * var(--fs));">${newest ? 'Prices as of ' + new Date(newest).toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''}</span></div>
    ${rows.length ? `<table class="mini-table"><tr><th>Gainers</th><th class="num">Today</th><th class="num">$</th><th class="num">Value</th></tr>${up.map(tr).join('') || '<tr><td colspan="4" class="sub">None up today</td></tr>'}
      <tr><th>Losers</th><th></th><th></th><th></th></tr>${down.map(tr).join('') || '<tr><td colspan="4" class="sub">None down today</td></tr>'}</table>`
      : '<div class="sub">Refresh prices (or import a CSV) to see what moved today.</div>'}`;
  card.querySelectorAll('tr[data-id]').forEach(r => { r.onclick = () => openPositionById(r.dataset.id); });
  return card;
}

function openPositionById(id) {

  ui.view = 'positions'; ui.selectedId = id; ui.statusFilter = 'all'; ui.search = '';

}

// ---------- 1.0 breakdowns ----------
function breakdowns(list, totals) {
  const maxStock = num(state.settings.maxStockPct) || 10, maxSector = num(state.settings.maxSectorPct) || 30;
  const base = totals.weightBase;
  const byTicker = new Map(), bySector = new Map(), byTheme = new Map(), byAccount = new Map();
  list.forEach(p => {
    const v = posValue(p);
    byTicker.set(p.ticker, (byTicker.get(p.ticker) || 0) + v);
    const sec = p.sector || (p.isEtf ? 'ETF / broad market' : 'Unassigned');
    bySector.set(sec, (bySector.get(sec) || 0) + v);
    byAccount.set(shortAcct(p.account || 'Main'), (byAccount.get(shortAcct(p.account || 'Main')) || 0) + v);
    (p.tags || []).forEach(t => byTheme.set(t, (byTheme.get(t) || 0) + v));
  });
  const toSorted = m => Array.from(m.entries()).map(([k, v]) => ({ label: k, val: v, pct: base > 0 ? (v / base) * 100 : 0 })).sort((a, b) => b.val - a.val);
  const top = toSorted(byTicker);
  const top5 = top.slice(0, 5).reduce((s, x) => s + x.pct, 0);
  const section = (title, subtitle, items, cap) => {
    const card = document.createElement('div');
    card.className = 'panel-card';
    card.innerHTML = `<div class="panel-head"><h4 class="panel-title">${esc(title)}</h4><span class="sub" style="font-size:calc(11.5px * var(--fs));">${esc(subtitle)}</span></div><div class="sec-body" style="display:flex;flex-direction:column;gap:7px;"></div>`;
    const body = card.querySelector('.sec-body');
    if (!items.length) { body.innerHTML = '<div class="sub">No data yet.</div>'; return card; }
    const scale = Math.max(25, items[0].pct * 1.1);
    items.slice(0, 10).forEach(it => {
      const over = cap && it.pct > cap;
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `<div class="bar-row-head"><div style="display:flex;align-items:center;gap:6px;"><strong>${esc(it.label)}</strong>${over ? `<span class="badge warn">Over ${cap}%</span>` : ''}</div><span class="sub" style="font-family:var(--mono);">${it.pct.toFixed(1)}% (${fmtMoneyShort(it.val)})</span></div><div class="bar-track"><div class="${over ? 'bar-fill-warn' : 'bar-fill-etf'}" style="width:${(it.pct / scale) * 100}%"></div></div>`;
      body.appendChild(row);
    });
    return card;
  };
  const grid = document.createElement('div');
  grid.className = 'overview-grid';
  grid.appendChild(section('Sector exposure', 'Limit: ' + maxSector + '% max', toSorted(bySector), maxSector));
  grid.appendChild(section('Top combined holdings', 'Top 5 = ' + top5.toFixed(1) + '% · Limit: ' + maxStock + '%', top, maxStock));
  grid.appendChild(section('Theme tags', 'Tagged across stocks and ETFs', toSorted(byTheme), null));
  grid.appendChild(section('Holdings by account', 'Without cash', toSorted(byAccount), null));
  return grid;
}

function deletePosition(p) {

  const removed = state.positions.splice(idx, 1)[0];
  saveState();
  render();

/* What's new: shown once the first time Stocks Hub opens after an update (per PC: seenVersion isn't synced),
   and any time from Settings. ADDON comes from CHANGES.md at build time. */
const newer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
function openWhatsNew(since) {
  const all = ADDON.changes || [];
  const pick = since ? all.filter(c => newer(c.version, since)) : all.slice(0, 2);
  const list = (pick.length ? pick : all.slice(0, 1)).map(c => `<h4 class="wn-head">${esc(c.version)}${c.date ? ' <span class="muted">' + esc(c.date) + '</span>' : ''}</h4>
    <ul class="wn-list">${c.lines.map(l => '<li>' + esc(l) + '</li>').join('')}</ul>`).join('');
  openModal("What's new in Stocks Hub", '<div class="wn">' + (list || '<p>No notes for this version.</p>') + '</div>',
    '<button id="mCancel" class="primary">Got it</button>', true);
  mFoot.querySelector('#mCancel').onclick = closeModal;
}
function maybeWhatsNew() {
  if (hasTome && tome.preview) return;
  const seen = state.seenVersion;
  if (seen === ADDON.version) return;
  const upgraded = seen ? seen !== ADDON.version : state.positions.length > 0;   // before 0.3 nothing was recorded
  state.seenVersion = ADDON.version;
  saveState();
  if (upgraded && (ADDON.changes || []).length) openWhatsNew(seen);
}
