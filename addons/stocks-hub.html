      <div class="field"><label>Right-click research links (Label | address with {TICKER})</label><textarea id="sLinks" rows="5" style="font-family:var(--mono);font-size:calc(11.5px * var(--fs));">${esc(linkLines)}</textarea></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="sExportCsv" class="quiet">Export positions CSV</button>
        <button id="sExportJson" class="quiet">Download a backup (JSON)</button>
        <button id="sLoadSample" class="quiet">Load sample data</button>
      </div>
    </div>

    <div class="tab-panel" data-panel="ai" hidden>
      <div class="hint">To plan or change Stocks Hub with an AI chat that knows nothing about it, copy everything and paste it as the first message of a new chat, then say what you'd like. None of your positions, notes or keys are included.</div>
      <div class="ai-rows">
        <div class="ai-row"><button id="sAiAll" class="primary">Make changes to this add-on</button><span class="sub">Copies how Tome add-ons work and their rules, what Stocks Hub is and how it's built, and its code, for a new AI chat.</span></div>
        <div class="ai-row"><button id="sAiSpec" class="quiet">Copy description</button><span class="sub">Just what Stocks Hub is: its views, saved data and source files. Enough for planning.</span></div>
        <div class="ai-row"><button id="sAiCode" class="quiet">Copy code</button><span class="sub">The whole add-on as one file, the way it's installed.</span></div>

    </div>`,
    `<button id="sWhatsNew" class="quiet wn-btn">What's new in ${esc(ADDON.version)}</button><button id="mCancel" class="quiet">Cancel</button><button id="mSave" class="primary">Save</button>`, true);

  const showTab = id => {
    mBody.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
    mBody.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== id; });
  };
  mBody.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
  showTab(tab || 'data');
  let size = s.fontSize || 'm', wb = s.weightBase === 'total' ? 'total' : 'invested';
  mBody.querySelectorAll('[data-size]').forEach(b => { b.onclick = () => {
    size = b.dataset.size;
    mBody.querySelectorAll('[data-size]').forEach(x => x.classList.toggle('on', x === b));
    document.documentElement.dataset.size = size;   // preview right away
  }; });
  mBody.querySelectorAll('[data-wb]').forEach(b => { b.onclick = () => { wb = b.dataset.wb; mBody.querySelectorAll('[data-wb]').forEach(x => x.classList.toggle('on', x === b)); }; });
  mBody.querySelector('#sExportCsv').onclick = exportPositionsCsv;

  mBody.querySelector('#sLoadSample').onclick = () => { closeModal(); loadSampleData(); };
  // For AI (0.5). Needs Tome 1.43 for the code; older Tome: the description, and the published file opens instead.
  const newKit = hasTome && typeof tome.aiPack === 'function';
  const put = (text, what) => { if (!text) { toast('Nothing to copy'); return; } if (hasTome && tome.copy) tome.copy(text); else navigator.clipboard.writeText(text).catch(() => {}); toast(what); };
  const PUBLISHED = 'https://raw.githubusercontent.com/tomer629/Tome-releases/main/addons/stocks-hub.html';
  mBody.querySelector('#sAiSpec').onclick = () => put(ADDON.spec, 'Description copied');
  mBody.querySelector('#sAiAll').onclick = async () => {
    if (newKit) { put(await tome.aiPack(), 'Copied. Paste it into a new AI chat and say what to change'); return; }
    put(ADDON.spec, 'Copied the description. Update Tome to copy the code too');
  };
  mBody.querySelector('#sAiCode').onclick = async () => {
    if (newKit) { put(await tome.code(), 'Code copied'); return; }
    if (hasTome && tome.open) tome.open(PUBLISHED); else window.open(PUBLISHED, '_blank');
    toast('Opened the published code: update Tome to copy it straight from here');
  };
  mFoot.querySelector('#mCancel').onclick = () => { sizeAttr(); closeModal(); };
  mFoot.querySelector('#sWhatsNew').onclick = () => { sizeAttr(); openWhatsNew(); };
  mFoot.querySelector('#mSave').onclick = () => {
    const v = id => mBody.querySelector(id);
    s.finnhubKey = v('#sFinnhub').value.trim();
    s.alphaVantageKey = v('#sAv').value.trim();
    s.customQuoteUrl = v('#sCustomUrl').value.trim();
    s.refreshHours = num(v('#sRefHours').value);
    s.dailyCallLimit = Math.max(10, num(v('#sLimit').value) || 150);
    s.marketHoursOnly = v('#sMarket').checked;
    s.autoChart = v('#sAutoChart').checked;
    s.autoNews = v('#sAutoNews').checked;
    s.fontSize = size;
    s.weightBase = wb;
    s.netWorthInBar = v('#sNwBar').checked;
    s.maxStockPct = Math.max(1, num(v('#sMaxStock').value) || 10);
    s.maxSectorPct = Math.max(1, num(v('#sMaxSector').value) || 30);
    s.staleDays = Math.max(1, num(v('#sStale').value) || 90);
    s.importRemindDays = Math.max(0, Math.round(num(v('#sRemind').value)));
    const links = [];
    v('#sLinks').value.split('\n').forEach(line => {
      const parts = line.split('|').map(x => x.trim());
      if (parts.length >= 2 && parts[0] && /^https?:\/\//.test(parts[1])) links.push({ label: parts[0], url: parts[1], etfOnly: (parts[2] || '').toLowerCase() === 'etf' });
    });
    if (links.length) s.researchLinks = links;
    Object.keys(loadErr).forEach(k => delete loadErr[k]);
    saveState(); closeModal(); toast('Settings saved'); render();
  };
}

function exportPositionsCsv() {
  const cols = ['Ticker','Name','Account','Type','Shares','AvgCost','CurrentPrice','Value','PnL','Status','Sector','Tags','LastReviewed','ExitStrategy'];
  const escCsv = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [cols.join(',')];
  state.positions.forEach(p => {
    lines.push([
      p.ticker, p.name, p.account, p.isEtf ? 'ETF' : 'Stock', p.shares, p.avgCost, p.currentPrice,
      posValue(p).toFixed(2), posPnl(p).toFixed(2), getThesisStatus(p), p.sector,
      (p.tags || []).join('; '), p.lastReviewed, p.exitStrategy
    ].map(escCsv).join(','));
  });
  downloadFile(`stocks-hub-${todayStr()}.csv`, lines.join('\n'), 'text/csv');
  toast('Exported CSV');
}

/* ---- 90-init.js ---- */
/* Start up: load saved data (1.0 data carries over), wire the buttons, take today's snapshot, refresh if due. */

document.getElementById('btnImport').onclick = openImportModal;
document.getElementById('btnRefresh').onclick = () => { if (ui.refreshing) { ui.refreshing = false; toast('Refresh stopped'); } else refreshAllQuotes(false); };
document.getElementById('btnSettings').onclick = () => openSettingsModal();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && backdrop.classList.contains('open')) { sizeAttr(); closeModal(); return; }
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || backdrop.classList.contains('open')) return;
  if (e.key === 'Delete' && ui.view === 'positions' && ui.selectedId) {
    const sel = state.positions.find(p => p.id === ui.selectedId);
    if (sel) deletePosition(sel);
  } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && ui.view === 'positions') {
    const cards = Array.from(document.querySelectorAll('#stockList .pos-card'));
    const i = cards.findIndex(c => c.dataset.id === ui.selectedId);
    const next = cards[Math.max(0, Math.min(cards.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) { e.preventDefault(); ui.selectedId = next.dataset.id; render(); const c = document.querySelector('#stockList .pos-card.selected'); if (c) c.scrollIntoView({ block: 'nearest' }); }
  } else if (e.key === '/' && ui.view === 'positions') {
    const s = document.getElementById('posSearch'); if (s) { e.preventDefault(); s.focus(); }
  }
});

// Drop a Fidelity CSV anywhere on the page.
document.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !/\.csv$/i.test(f.name) || e.target.closest('#dropZone')) return;
  e.preventDefault();
  openImportModal();
  const r = new FileReader(); r.onload = () => window.__shImportText(String(r.result || '')); r.readAsText(f);
});

if (hasBar && typeof tome.bar.onPick === 'function') tome.bar.onPick(({ id }) => { ui.view = id; render(); });

let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

function hydrate(saved) {
  const def = defaultState();
  if (!saved || typeof saved !== 'object') { state = def; return; }
  state = Object.assign({}, def, saved, {
    settings: Object.assign({}, def.settings, saved.settings || {}),
    etfCache: saved.etfCache || {},
    positions: Array.isArray(saved.positions) ? saved.positions : [],
    watchlist: Array.isArray(saved.watchlist) ? saved.watchlist : [],
    closed: Array.isArray(saved.closed) ? saved.closed : [],
    cashByAccount: saved.cashByAccount && typeof saved.cashByAccount === 'object' ? saved.cashByAccount : {},
    openOptionsByAccount: saved.openOptionsByAccount && typeof saved.openOptionsByAccount === 'object' ? saved.openOptionsByAccount : {},
    openOptions: Array.isArray(saved.openOptions) ? saved.openOptions : [],
    accountKinds: saved.accountKinds && typeof saved.accountKinds === 'object' ? saved.accountKinds : {},
    manualAssets: Array.isArray(saved.manualAssets) ? saved.manualAssets : [],
    snapshots: Array.isArray(saved.snapshots) ? saved.snapshots : [],
    cache: Object.assign({ chart: {}, news: {}, earn: {} }, saved.cache || {}),
    api: saved.api && typeof saved.api === 'object' ? saved.api : { day: '', finnhub: 0, av: 0 }
  });
  // 1.0 refreshed every 4 hours around the clock; keep a saved choice but default the new options.
  if (saved.settings && saved.settings.marketHoursOnly == null) state.settings.marketHoursOnly = true;
}

async function init() {
  if (hasTome && tome.data) {
    hydrate(await tome.data.get());
    // Changes from another PC (Tome sync) or another tab. While you're typing, the redraw waits until you leave the box,
    // so a sync never knocks you out of a note.
    if (typeof tome.data.onChange === 'function') tome.data.onChange(val => {
      hydrate(val);
      const a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !backdrop.classList.contains('open')) {
        if (!a.dataset.shPending) { a.dataset.shPending = '1'; a.addEventListener('blur', () => { delete a.dataset.shPending; setTimeout(render, 0); }, { once: true }); }
        if (a.id === 'exitNotes') a.dispatchEvent(new Event('input'));   // keep what's typed in the new copy
        renderSummaryBar();
        return;
      }
      if (backdrop.classList.contains('open')) { renderSummaryBar(); return; }
      render();
    });
  }
  sizeAttr();
  render();
  if (!(hasTome && tome.preview) && !(state.snapshots || []).some(s => s.date === todayStr()) && state.positions.length) { takeSnapshot(); saveState(); }
  maybeWhatsNew();
  // No price calls in a preview: Tome's install preview and its hidden test before an update (tome.preview) save nothing,
  // so the calls would be spent for nothing.
  if (!(hasTome && tome.preview)) {
    if (autoRefreshDue()) refreshAllQuotes(true);
    setInterval(() => { if (autoRefreshDue() && !document.hidden) refreshAllQuotes(true); }, 10 * 60000);
  }
}
init();

})();
