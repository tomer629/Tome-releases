<style>
body { padding: 0; overflow: hidden; height: 100vh; }

/* ---------- library ---------- */

.rb-list { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.rc { display: grid; grid-template-columns: calc(46px * var(--t)) minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 6px; border-radius: 8px; color: var(--fg); }

.rb-foot { border-top: 1px solid var(--line); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }

.gro-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.keys { color: var(--muted); font-size: calc(11.5px * var(--t)); line-height: 1.4; }
.keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--card); }
.rb-empty { color: var(--muted); padding: 16px 10px; font-size: calc(13.5px * var(--t)); text-align: center; }

/* ---------- main ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 16px 22px 40px; }

/* recipe view */

.rb-tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 16px 0 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.stepper { display: inline-flex; align-items: center; gap: 2px; }

.stepper button { width: calc(28px * var(--b)); height: calc(28px * var(--b)); border: 1px solid var(--line); background: none; border-radius: 6px; padding: 0; font-size: 16px; line-height: 1; color: var(--fg); }
.stepper button:hover { border-color: var(--accent); color: var(--accent); }

.quick { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.quick button { border: 0; background: none; padding: 3px 10px; font-size: calc(13px * var(--t)); color: var(--muted); }
.quick button + button { border-left: 1px solid var(--line); }
.quick button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.from { font-size: calc(12.5px * var(--t)); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 4px 1px 10px; display: inline-flex; align-items: center; gap: 4px; }
.from button { border: 0; background: none; color: inherit; padding: 0 5px; font-size: 14px; line-height: 1; }
.sw { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; color: var(--fg); font-size: calc(13.5px * var(--t)); }
.sw i { width: 30px; height: 17px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.sw.on i { background: var(--accent); }
.sw.on i::after { transform: translateX(13px); }
.rb-tools .grow { margin-left: auto; }
.rv-body { display: grid; grid-template-columns: minmax(calc(260px * var(--t)), 2fr) minmax(0, 3fr); gap: 26px; margin-top: 14px; }
.rv-body h2, .notes h2 { font-size: calc(15px * var(--t)); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.rv-body h2 .sub, .notes h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: calc(12.5px * var(--t)); margin-left: auto; }
ul.ings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.ing input { margin: 0; transform: translateY(2px); accent-color: var(--accent); }
.ing.got .nm, .ing.got .amt { text-decoration: line-through; color: var(--muted); }
.ing.off .nm, .ing.off .amt { color: var(--muted); opacity: .6; text-decoration: line-through; }
.amt { border: 0; background: none; padding: 0 3px; margin: 0 -3px; border-radius: 4px; font-weight: 600; color: var(--fg); white-space: nowrap; text-align: left; font-variant-numeric: tabular-nums; }
.amt:hover { background: var(--accent-soft); color: var(--accent); }

.amt.rb-none:hover { background: none; }
.amt-in { width: calc(110px * var(--t)); padding: 1px 6px !important; font-weight: 600; }
.nm { overflow-wrap: anywhere; }
.nm .ing-note, .nm .size { color: var(--muted); }
.opt { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 0 8px 0 5px; font-size: calc(11.5px * var(--t)); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.opt i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.opt.on { color: var(--ok); border-color: var(--ok); }
.opt.on i { background: var(--ok); border-color: var(--ok); }
.ing-head { font-weight: 600; padding: 12px 4px 4px; color: var(--fg); border-bottom: 1px solid var(--line); }

ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.step { display: grid; grid-template-columns: calc(28px * var(--t)) minmax(0, 1fr); gap: 10px; line-height: 1.55; }
.step .num { width: calc(26px * var(--t)); height: calc(26px * var(--t)); border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: calc(13px * var(--t)); margin-top: 1px; }
.ref { border-bottom: 1px dotted var(--accent); cursor: help; }
.tmr { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 8px 0 6px; font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; line-height: 1.35; }
.tmr:hover { background: var(--accent); color: var(--accent-fg); }

.notes { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 26px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.pin { width: 100%; min-height: 90px; resize: vertical; line-height: 1.45; field-sizing: content; max-height: 260px; }
.log { display: flex; flex-direction: column; gap: 6px; }
.log-e { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }

.rate button.on { color: var(--soon); }
.rate.ro button { cursor: default; font-size: calc(14px * var(--t)); }
.empty-note { color: var(--muted); font-size: calc(13.5px * var(--t)); margin: 0; }

/* editor */
.ed { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
.ed-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.ed-title { font-size: calc(22px * var(--t)) !important; font-weight: 600; width: 100%; padding: 6px 10px !important; }
.ed-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.ed-meta label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: calc(13px * var(--t)); }
.ed-meta input { padding: 4px 8px; }
.ed-meta .srv { width: calc(64px * var(--t)); }
.ed-meta .tim { width: calc(120px * var(--t)); }
.ed-meta .tgs { width: calc(240px * var(--t)); }
.ph-slot { width: calc(150px * var(--t)); height: calc(96px * var(--t)); border: 1.5px dashed var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: calc(12.5px * var(--t)); text-align: center; padding: 6px; background: var(--card) center / cover no-repeat; cursor: pointer; }

.ed-col { display: flex; flex-direction: column; min-height: 0; gap: 6px; }
.ed-col h2 { font-size: calc(13px * var(--t)); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.ed-col h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 10px; }
.ed-col textarea { flex: 1; min-height: calc(130px * var(--t)); resize: none; font-family: inherit; line-height: 1.6; padding: 8px 10px; }
.sugg { display: flex; gap: 5px; flex-wrap: wrap; min-height: calc(22px * var(--t)); align-items: center; }
.sugg button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 9px; font-size: calc(12.5px * var(--t)); color: var(--fg); }
.sugg button:first-of-type { border-color: var(--accent); color: var(--accent); }
.sugg small { color: var(--muted); font-size: calc(11.5px * var(--t)); }
.pv { flex: none; max-height: 40%; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 4px 0; font-size: calc(13px * var(--t)); }
.pv-r { display: grid; grid-template-columns: calc(48px * var(--t)) calc(50px * var(--t)) minmax(0, 1fr); gap: 6px; padding: 2px 10px; align-items: baseline; }
.pv-r .q { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.pv-r .u { color: var(--accent); }
.pv-r .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-r .x i { color: var(--muted); font-style: normal; }
.pv-r .o { font-size: calc(11px * var(--t)); color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 5px; margin-left: 4px; }
.pv-r.h { grid-template-columns: 1fr; font-weight: 600; padding-top: 5px; }
.pv-r .no { color: var(--muted); text-align: right; font-size: calc(11.5px * var(--t)); }
.ed-foot { display: flex; gap: 8px; align-items: center; flex: none; }
.ed-foot .ed-hint { margin-right: auto; color: var(--muted); font-size: calc(12.5px * var(--t)); }

/* grocery */
.gv { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
.gv-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gv-head h1 { margin-right: auto; }
.gv-head .sub { color: var(--muted); }
.gv-recs { display: flex; flex-wrap: wrap; gap: 6px; }
.gv-rec { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 6px 2px 12px; display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--t)); }
.gv-rec b { font-weight: 600; }
.gv-rec span { color: var(--muted); }
.gv-rec button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
.gv-rec button:hover { color: var(--late); }
.gv-add { display: flex; gap: 6px; }
.gv-add input { flex: 1; }
ul.gl { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.gl li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.gl li:first-child { border-top: 0; }
.gl li.rb-done .gt { text-decoration: line-through; color: var(--muted); }
.gl li input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
.gl .gt b { font-weight: 600; margin-right: 6px; }
.gl .gs { color: var(--muted); font-size: calc(12px * var(--t)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(220px * var(--t)); }
.gl .sep { display: block; padding: 6px 12px; color: var(--muted); font-size: calc(12px * var(--t)); text-transform: uppercase; letter-spacing: .06em; background: var(--col); }

/* cook mode */
.cook { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.cm-top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.cm-top b { font-size: calc(17px * var(--t)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm-top .n { color: var(--muted); margin-right: auto; white-space: nowrap; }
.cm-body { display: grid; grid-template-columns: minmax(0, 1fr) calc(300px * var(--t)); min-height: 0; }
.cm-main { overflow: auto; padding: 28px 40px; display: flex; flex-direction: column; gap: 22px; }
.cm-num { color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: calc(14px * var(--t)); }
.cm-text { font-size: calc(27px * var(--t)); line-height: 1.5; max-width: 900px; }
.cm-text .tmr { font-size: .8em; vertical-align: .08em; }

.cm-use ul { margin: 0; padding: 0; list-style: none; font-size: calc(19px * var(--t)); display: flex; flex-direction: column; gap: 4px; }
.cm-use li b { margin-right: 8px; }
.cm-use .rb-none { color: var(--muted); font-size: calc(15px * var(--t)); }
.cm-all { border-left: 1px solid var(--line); overflow: auto; padding: 18px 16px; }
.cm-all h3 { font-size: calc(13px * var(--t)); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.cm-all ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.cm-all li { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; cursor: pointer; line-height: 1.35; }
.cm-all li:hover { background: var(--accent-soft); }
.cm-all li.now { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.cm-all li.got { color: var(--muted); text-decoration: line-through; }
.cm-all li .cm-box { flex: none; width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 4px; transform: translateY(2px); }
.cm-all li.got .cm-box { background: var(--ok); border-color: var(--ok); }
.cm-all li.grp { font-weight: 600; cursor: default; padding-top: 10px; }
.cm-all li.grp:hover { background: none; }
.cm-foot { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); }
.cm-foot .primary, .cm-foot .quiet { min-width: calc(110px * var(--b)); }
.dots { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: var(--line); }
.dots button.on { background: var(--accent); transform: scale(1.3); }
.dots button.past { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.cm-done { margin: auto; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: 520px; }
.cm-done h2 { font-size: calc(28px * var(--t)); }
.cm-done .rate button { font-size: calc(34px * var(--t)); }
.cm-done input { width: min(440px, 80vw); }

/* timers */
.timers { position: fixed; right: 14px; bottom: 14px; z-index: 25; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.tm { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 6px 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .14); min-width: calc(200px * var(--t)); }
.tm .lb { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.tm .lb small { color: var(--muted); font-size: calc(11.5px * var(--t)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: calc(170px * var(--t)); }
.tm .left { font-size: calc(20px * var(--t)); font-weight: 700; font-variant-numeric: tabular-nums; }
.tm.paused .left { color: var(--muted); }

/* Click an amount, type what you have ("3", "1.5 lb", "2 1/2 cups"), Enter: the whole recipe scales from it. */
function scaleFrom(r, ing, p, btn) {
  const am = amountOf(p, factorOf(r));
  if (!am) return;
  const inp = h("input", "amt-in"); inp.type = "text"; inp.value = am.text === "a pinch" ? "" : am.text; inp.title = "Type the amount you have, then Enter";
  btn.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const fin = ok => {
    if (done) return; done = true;
    if (!ok) { render(); return; }
    const t = parseIng(inp.value.trim() + " x");
    if (!t || t.qty == null || !(t.qty > 0)) { render(); if (inp.value.trim()) tome.toast("Type an amount, like 3 or 1.5 lb"); return; }
    const pu = p.unit ? U[p.unit] : null;
    let nf = null;
    const prim = am.parts[0] || [null, null], pk = prim[1];
    if (t.unit && pu && U[t.unit] && U[t.unit].dim === pu.dim && pu.dim !== "count") nf = (t.qty * U[t.unit].b) / (p.qty * pu.b);
    else if (!t.unit && pk && U[pk] && pu && U[pk].dim === pu.dim && pu.dim !== "count") nf = (t.qty * U[pk].b) / (p.qty * pu.b);
    else if (!t.unit || t.unit === p.unit) nf = t.qty / p.qty;
    if (!nf || !isFinite(nf) || nf <= 0) { render(); tome.toast("That unit doesn't match " + p.name); return; }

  inp.onblur = () => fin(true);
}

function removeFromList(it) {

/* ---------- cook mode ---------- */
let cook = null;
function startCook(id, at) {
  const r = byId(id);
  if (!r || !r.steps.length) return;
  cook = { rid: id, i: clamp(at || 0, 0, r.steps.length - 1), done: false, stars: 0, note: "" };
  $("cook").hidden = false;
  drawCook();
}
function endCook() {
  cook = null; $("cook").hidden = true; $("cook").replaceChildren();
  render();
}
function drawCook() {
  const r = cook && byId(cook.rid);
  if (!r) { endCook(); return; }
  const box = $("cook"), f = factorOf(r), n = r.steps.length, uses = stepUses(r);
  box.replaceChildren();
  const top = h("div", "cm-top");
  top.append(h("b", null, r.title), h("span", "n", cook.done ? "Done" : "Step " + (cook.i + 1) + " of " + n + (Math.abs(f - 1) > 1e-9 ? " · " + (r.servings ? "serves " + nice(r.servings * f) : xText(f)) : "")));
  const x = h("button", "quiet", "Close"); x.type = "button"; x.title = "Esc"; x.onclick = endCook;
  top.append(x);
  const body = h("div", "cm-body");
  const mainEl = h("section", "cm-main");
  if (cook.done) {
    const dn = h("div", "cm-done");
    dn.append(h("h2", null, "All done"), h("p", "sub", "How did it turn out? Rate it and add a note to the cook log."));
    const rate = stars(cook.stars, v => { cook.stars = v; drawCook(); });
    const note = h("input"); note.type = "text"; note.placeholder = "A note for next time (optional)"; note.value = cook.note; note.maxLength = 400;
    note.oninput = () => { cook.note = note.value; };
    const row = h("div", "tome-row");
    const sv = h("button", "primary", "Save to cook log"); sv.type = "button";
    const sk = h("button", "quiet", "Skip"); sk.type = "button";
    sv.onclick = () => { r.log.unshift({ id: uid(), date: todayStr(), stars: cook.stars, note: cook.note.trim() }); save(); endCook(); tome.toast("Added to the cook log"); };
    note.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sv.click(); } };
    sk.onclick = endCook;
    row.append(sv, sk); row.style.justifyContent = "center";
    dn.append(rate, note, row);
    mainEl.append(dn);
    setTimeout(() => note.focus(), 0);
  } else {
    const st = r.steps[cook.i];
    mainEl.append(h("div", "cm-num", "Step " + (cook.i + 1)));
    const tx = h("div", "cm-text"); tx.innerHTML = stepHtml(r, st, f);
    tx.addEventListener("click", e => { const b = e.target.closest(".tmr"); if (b) startTimer(r, b); });
    tx.oncontextmenu = e => tome.menu(e, stepMenu(r, cook.i).filter(it => !(it && it.label === "Cook from this step")));
    mainEl.append(tx);
    const use = h("div", "cm-use");
    use.append(h("h3", null, "For this step"));
    const ids = uses[cook.i].filter(id => !r.off.includes(id));
    if (!ids.length) use.append(h("p", "rb-none", "Nothing new to add. Right-click the step to pick its ingredients."));
    else {
      const ul = h("ul");
      ids.forEach(id => { const ing = r.ings.find(i => i.id === id), p = ing && parseIng(ing.text); if (!p) return; const li = h("li"); const a = amountOf(p, f); if (a) { const b = h("b", null, a.text); if (a.exact) b.title = "Exact: " + a.exact; li.append(b); } li.append(document.createTextNode(p.name + (p.note ? ", " + p.note : ""))); ul.append(li); });
      use.append(ul);
    }
    use.oncontextmenu = e => tome.menu(e, stepMenu(r, cook.i).filter(it => !(it && it.label === "Cook from this step")));
    mainEl.append(use);
  }
  const all = h("aside", "cm-all");
  all.append(h("h3", null, "All ingredients"));
  const ul = h("ul");
  const nowIds = cook.done ? [] : uses[cook.i];
  r.ings.forEach(ing => {
    const p = parseIng(ing.text); if (!p) return;
    if (p.head) { ul.append(h("li", "grp", p.name)); return; }
    if (r.off.includes(ing.id)) return;
    const li = h("li", (r.got.includes(ing.id) ? "got" : "") + (nowIds.includes(ing.id) ? " now" : ""));
    li.append(h("span", "cm-box"), h("span", null, ingText(p, f)));
    li.title = "Click to tick off";
    li.onclick = () => { r.got = r.got.includes(ing.id) ? r.got.filter(x => x !== ing.id) : [...r.got, ing.id]; save(); drawCook(); };
    ul.append(li);
  });
  all.append(ul);
  body.append(mainEl, all);
  const foot = h("div", "cm-foot");
  const back = h("button", "quiet", "Back"); back.type = "button"; back.disabled = !cook.done && cook.i === 0; back.title = "Left arrow";
  back.onclick = () => cookGo(-1);
  const dots = h("div", "dots");
  r.steps.forEach((s, i) => { const d = h("button", !cook.done && i === cook.i ? "on" : (cook.done || i < cook.i ? "past" : "")); d.type = "button"; d.title = "Step " + (i + 1); d.setAttribute("aria-label", "Step " + (i + 1)); d.onclick = () => { cook.done = false; cook.i = i; drawCook(); }; dots.append(d); });
  const next = h("button", "primary", cook.done ? "Close" : cook.i === n - 1 ? "Finish" : "Next"); next.type = "button"; next.title = "Right arrow or Space";
  next.onclick = () => (cook.done ? endCook() : cookGo(1));

}
function cookGo(d) {
  const r = byId(cook.rid);
  if (!r) return;
  if (cook.done) { if (d < 0) { cook.done = false; cook.i = r.steps.length - 1; drawCook(); } return; }
  const i = cook.i + d;
  if (i >= r.steps.length) { cook.done = true; drawCook(); return; }
  cook.i = clamp(i, 0, r.steps.length - 1);

}

/* ---------- timers ---------- */
let timers = [], tick = null, audio = null;
function startTimer(r, btn) {
  const secs = Number(btn.dataset.secs);
  if (!secs) return;
  const label = btn.dataset.label;
  const same = timers.find(t => t.rid === r.id && t.label === label && !t.ring);
  if (same) { tome.toast("That timer is already running"); return; }
  timers.push({ id: uid(), rid: r.id, title: r.title, label, total: secs, end: Date.now() + secs * 1000, paused: null, ring: false, rang: 0 });
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { /* no sound here */ }
  drawTimers();
  if (!tick) tick = setInterval(tickTimers, 250);
}
const left = t => t.paused != null ? t.paused : Math.max(0, t.end - Date.now());
const mmss = ms => { const s = Math.ceil(ms / 1000), hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (hh ? hh + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0"); };
function beep() {
  if (!audio) return;
  try {
    const t0 = audio.currentTime;
    [0, 0.25, 0.5].forEach(o => { const os = audio.createOscillator(), g = audio.createGain(); os.frequency.value = 880; os.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(0.0001, t0 + o); g.gain.exponentialRampToValueAtTime(0.25, t0 + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + o + 0.18); os.start(t0 + o); os.stop(t0 + o + 0.2); });
  } catch (e) { /* ignore */ }
}
function tickTimers() {
  const now = Date.now();
  let rang = false;
  timers.forEach(t => {
    if (!t.ring && t.paused == null && t.end <= now) { t.ring = true; t.rang = now; t.beeps = 1; rang = true; beep(); tome.toast("Timer done: " + t.label + " (" + t.title + ")"); }
    else if (t.ring && now - t.rang > 6000 && t.beeps < 6) { t.rang = now; t.beeps++; beep(); }
  });
  document.title = timers.some(t => t.ring) ? "Timer done - Recipes" : "Recipes";
  timers.forEach(t => { const e = document.querySelector('.tm[data-id="' + t.id + '"] .left'); if (e) e.textContent = t.ring ? "Done" : mmss(left(t)); });
  if (!timers.length) { clearInterval(tick); tick = null; }
  if (rang) drawTimers();
}
function drawTimers() {
  const box = $("timers");
  box.replaceChildren();
  timers.forEach(t => {
    const e = h("div", "tm" + (t.ring ? " ring" : "") + (t.paused != null ? " paused" : ""));
    e.dataset.id = t.id;
    const lb = h("span", "lb"); lb.append(h("span", "left", t.ring ? "Done" : mmss(left(t))), h("small", null, t.label + " · " + t.title));
    const pp = h("button"); pp.type = "button";
    pp.innerHTML = t.paused != null ? ICON.play : ICON.pause; pp.title = t.paused != null ? "Resume" : "Pause";
    pp.hidden = t.ring;
    pp.onclick = () => { if (t.paused != null) { t.end = Date.now() + t.paused; t.paused = null; } else t.paused = left(t); drawTimers(); };
    const x = h("button", null, "×"); x.type = "button"; x.title = t.ring ? "Stop" : "Cancel timer";
    x.onclick = () => { timers = timers.filter(y => y !== t); drawTimers(); tickTimers(); };
    e.append(lb, pp, x);
    e.oncontextmenu = ev => tome.menu(ev, [
      { label: "Add 1 minute", action: () => { if (t.ring) { t.ring = false; t.end = Date.now() + 60000; t.beeps = 0; } else if (t.paused != null) t.paused += 60000; else t.end += 60000; drawTimers(); } },
      { label: "Add 5 minutes", action: () => { if (t.ring) { t.ring = false; t.end = Date.now() + 300000; t.beeps = 0; } else if (t.paused != null) t.paused += 300000; else t.end += 300000; drawTimers(); } },
      { label: "Restart", action: () => { t.ring = false; t.paused = null; t.beeps = 0; t.end = Date.now() + t.total * 1000; drawTimers(); } },
      "-",
      { label: "Open recipe", action: () => openRecipe(t.rid) },
      { label: t.ring ? "Stop" : "Cancel timer", danger: true, action: () => { timers = timers.filter(y => y !== t); drawTimers(); tickTimers(); } },
    ]);
    if (t.ring) e.onclick = ev => { if (ev.target.closest("button")) return; timers = timers.filter(y => y !== t); drawTimers(); tickTimers(); };
    box.append(e);
  });
  if (timers.length && !tick) tick = setInterval(tickTimers, 250);
}

/* ---------- more: sample, export, import ---------- */
function addSample() {

    id: uid(), title: "Buttermilk Pancakes", servings: 4, time: "25 min", tags: ["breakfast"],
    ings: ["2 cups all-purpose flour", "2 tbsp sugar", "2 tsp baking powder", "1/2 tsp baking soda", "1/2 tsp salt", "2 cups buttermilk", "2 large eggs", "3 tbsp unsalted butter, melted", "? 1 cup blueberries"].map(text => ({ id: uid(), text })),
    steps: ["Whisk the flour, sugar, baking powder, baking soda and salt in a large bowl.",
      "In another bowl, whisk the buttermilk, eggs and melted butter.",
      "Pour the wet mix into the dry and stir until just combined. Fold in the blueberries. Let the batter rest 5 minutes.",
      "Heat a lightly greased griddle over medium heat. Pour 1/4 cup of batter per pancake and cook 2 to 3 minutes, until bubbles form.",
      "Flip and cook 1 to 2 minutes more, until golden. Serve warm."].map(text => ({ id: uid(), text })),
    note: "Sample recipe: try the Servings buttons, click an amount to scale from it, or press Cook.",

}
function moreMenu() {
  const mb = Math.round(sizeMB() * 10) / 10;
  return [
    { label: "New recipe", action: () => newRecipe() },
    { label: "Add a sample recipe", action: addSample },
    "-",
    { label: "Export all recipes", disabled: !S.recipes.length, action: () => tome.download("recipes-" + todayStr() + ".json", JSON.stringify({ kind: "tome-recipes", v: VER, recipes: S.recipes }, null, 1), "application/json") },
    { label: "Import recipes...", action: () => $("importFile").click() },
    "-",
    { label: "Storage used: " + (mb < 0.1 ? "under 0.1" : mb) + " MB of 5", disabled: true },

$("importFile").onchange = async () => {
  const f = $("importFile").files[0];
  $("importFile").value = "";
  if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    const list = Array.isArray(o) ? o : arr(o.recipes);
    if (!list.length) throw new Error("none");
    let added = 0, upd = 0;
    list.map(cleanRecipe).forEach(r => {
      const old = byId(r.id);
      if (!old) { S.recipes.push(r); added++; }
      else if (r.updated > old.updated) { Object.assign(old, r); upd++; }
    });
    save(); render();
    tome.toast(added + " recipe" + (added === 1 ? "" : "s") + " added" + (upd ? ", " + upd + " updated" : ""));
  } catch (e) { tome.toast("That file doesn't hold recipes"); }

/* ---------- keys, paste and wiring ---------- */
const typing = () => { const a = document.activeElement; return a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };
document.addEventListener("keydown", e => {
  if (document.querySelector(".ctx-root")) return;
  if (document.querySelector(".lightbox")) { if (e.key === "Escape") document.querySelector(".lightbox").remove(); return; }
  if (cook) {
    if (typing()) { if (e.key === "Escape") { e.preventDefault(); document.activeElement.blur(); } return; }
    if (e.key === "Escape") { e.preventDefault(); endCook(); }
    else if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); cookGo(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); cookGo(-1); }
    else if (e.key.toLowerCase() === "t" && !e.ctrlKey && !e.metaKey) { const b = $("cook").querySelector(".cm-text .tmr"); if (b) b.click(); }
    return;
  }
  if (S.ui.view === "edit" && S.draft) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitEdit(); }
    else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
    else if (e.key.toLowerCase() === "s" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitEdit(); }
    return;
  }
  if (typing()) { if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; $("q").blur(); renderSide(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), r = byId(S.ui.sel);
  if (k === "n") { e.preventDefault(); newRecipe(); }
  else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
  else if (k === "g") { e.preventDefault(); openGrocery(); }
  else if (k === "c" && r && S.ui.view === "recipe") { e.preventDefault(); startCook(r.id); }
  else if (k === "e" && r && S.ui.view === "recipe") { e.preventDefault(); editRecipe(r.id); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && S.recipes.length) {
    e.preventDefault();
    const v = visible().map(x => x.r.id), i = v.indexOf(S.ui.sel);
    const j = clamp(i < 0 ? 0 : i + (e.key === "ArrowDown" ? 1 : -1), 0, v.length - 1);
    if (v[j]) { openRecipe(v[j]); const b = $("list").querySelector('[data-id="' + v[j] + '"]'); if (b) b.scrollIntoView({ block: "nearest" }); }
  }
});
document.addEventListener("paste", e => {
  if (typing() || cook || (S.ui.view === "edit" && S.draft)) return;
  const text = e.clipboardData.getData("text/plain");
  if (!text.trim()) return;
  e.preventDefault();
  if (looksLikeRecipe(text)) { const p = parseRecipeText(text), d = {}; fillFrom(Object.assign(d, draftFrom(null)), p); newRecipe(d); }
  else tome.toast("That doesn't look like a whole recipe. Click + New to type one in.");
});
$("q").addEventListener("input", () => renderSide());
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { const v = visible(); if (v[0]) { openRecipe(v[0].r.id); $("q").blur(); } }
  else if (e.key === "ArrowDown") { e.preventDefault(); $("q").blur(); const v = visible(); if (v[0]) openRecipe(v[0].r.id); }
});
$("new").onclick = () => newRecipe();
$("gro").onclick = openGrocery;
$("more").onclick = e => { const b = $("more").getBoundingClientRect(); tome.menu(b.left, b.top, moreMenu()); e.stopPropagation(); };
$("list").addEventListener("contextmenu", e => { if (e.target.closest(".rc")) return; tome.menu(e, moreMenu()); });

tome.data.onChange(v => {
  const t = JSON.stringify(v);
  if (sent.includes(t)) return;
  const keep = S.draft, view = S.ui.view;
  S = clean(v);
  if (keep && view === "edit") { S.draft = keep; S.ui.view = "edit"; return; }
  if (typing()) { document.activeElement.addEventListener("blur", () => render(), { once: true }); return; }
  render();

});
if (S.ui.view === "edit" && S.draft) { edBase = ""; renderSide(); renderEditor("title"); tome.toast("Picked up the recipe you were editing"); }
else render();

/* Make changes to this add-on (1.4): copies what a new AI chat needs to change it. Tome 1.43+ adds how add-ons work
   and the code (tome.aiPack); older Tome copies just this description. Never includes saved data. */
const ABOUT = `# Recipes

A Tome add-on (id \`recipes\`, single HTML file kept in the Tome repo's addons folder, about 120 KB). A recipe book with scaling, unit conversion, a grocery list grouped by aisle, a cook mode with timers, ratings and a cook log, and tag pills in Tome's bar.

- Side panel: the recipe list with search and sort; tags, All and Favorites are pills in Tome's bar (tome.bar, Tome 1.31+), right-click a tag to rename or remove it.
- Recipe view: servings and units, ingredients (tick off, right-click), steps, notes, cook log; right-click almost anything for more. Pasting a recipe's text or a web page's address fills a new one.
- More menu (the dots at the top of the list): new recipe, sample recipe, export and import, storage used, Make changes to this add-on.
- The book syncs between the person's PCs and phone through Tome's sync (Tome's js/sync-recipes.js, and the phone's RecipeCore.kt, which must follow the same rules: units, scaling, aisles). Changes to those rules have to be made in all three places, so say so when a change touches them.

Saved data (tome.data), \`v: 1\`: \`{ v, recipes: [{ id, title, servings, time, tags[], fav, photo, ings: [{ id, text }], steps: [{ id, text, use }], note, log: [{ id, date, stars, note }], off[], got[], created, updated }], grocery: { items, extra, done }, prefs: { round, units, sort }, ui: { ... }, draft }\`. Never rename or remove these fields: the phone app reads them too.`;
if (typeof tome.about === "function") tome.about(ABOUT);
async function makeChanges() {
  if (typeof tome.aiPack === "function") { tome.copy(await tome.aiPack()); tome.toast("Copied. Paste it into a new AI chat and say what to change."); }
  else { tome.copy(ABOUT); tome.toast("Copied the description. Update Tome to copy the code too."); }
}
